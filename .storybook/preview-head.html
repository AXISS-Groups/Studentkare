<style>body { background: var(--sk-color-canvas); }
/* The 4 illustration-sparkline-* assets (design/illustrations/*.svg) ship with
   a CSS line-draw animation keyed to "skDraw", but that keyframe is defined only
   in src/features/landing/views/landing.css. Outside the Landing page (e.g. the
   VitalTrends preview, a student-app phone screen) the animation never plays —
   stroke-dashoffset stays at its initial value and only the endpoint dot shows.
   Same keyframe, defined once here so any Storybook story using these renders
   correctly. If VitalTrends is ever built for real outside Landing, the real app
   needs this keyframe loaded globally too, not just here. */
@keyframes skDraw { to { stroke-dashoffset: 0; } }
</style>
