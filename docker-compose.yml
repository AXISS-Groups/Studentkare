services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studentkare-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - studentkare

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: studentkare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - studentkare

networks:
  studentkare:
    driver: bridge
