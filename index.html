<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Student Kare — Student Health Platform</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f4f6;
      --surface: #ffffff;
      --surface-2: #eceaf5;
      --surface-3: #e7e4fb;
      --rule: #d8d8e3;
      --rule-soft: #e6e6ee;
      --veil: #b9b6e8;
      --ink: #16165c;
      --ink-2: #232269;
      --text: #16165c;
      --text-2: #4a4a63;
      --text-3: #6d6d84;
      --action: #5350cc;
      --on-action: #ffffff;
      --data: #4f4cc9;
      --data-2: #5350cc;
      --art: #8f86d8;
      --art-soft: #b1a6f6;
      --cyan: #00b1ff;
      --positive: #007a55;
      --positive-fill: #00ffaa;
      --attention: #8a5200;
      --attention-fill: #ffb020;
      --emergency: #b3241a;
      --reward: #0e7490;
      --glow: rgba(83, 80, 204, 0.22);
    }

    html[data-theme="light"] {
      --canvas: #f4f4f6;
      --surface: #ffffff;
      --surface-2: #eceaf5;
      --surface-3: #e7e4fb;
      --rule: #d8d8e3;
      --rule-soft: #e6e6ee;
      --veil: #b9b6e8;
      --ink: #16165c;
      --ink-2: #232269;
      --text: #16165c;
      --text-2: #4a4a63;
      --text-3: #6d6d84;
      --action: #524FD9;
      --action-hover: #4441b8;
      --data: #4f4cc9;
      --positive: #007a55;
      --positive-fill: #00ffaa;
      --attention: #8a5200;
      --attention-fill: #ffb020;
      --emergency: #b3241a;
      --reward: #0e7490;
      --glow: rgba(82, 79, 217, 0.18);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      scroll-behavior: smooth;
      background-color: var(--canvas);
      font-family: 'Plus Jakarta Sans', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    * {
      box-sizing: border-box;
    }

    input, textarea, button {
      font-family: inherit;
    }

    @keyframes sk-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes sk-draw { to { stroke-dashoffset: 0; } }
    @keyframes sk-dash { to { stroke-dashoffset: -220; } }
    @keyframes sk-ping { 0% { r: 3; opacity: 1; } 70% { r: 13; opacity: 0; } 100% { r: 13; opacity: 0; } }
    @keyframes sk-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes sk-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes sk-tick { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes sk-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes sk-sheen { 0% { transform: translateX(-130%); } 100% { transform: translateX(230%); } }
    @keyframes sk-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes sk-marquee-rev { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @keyframes sk-scan-laser { 0% { top: 4%; opacity: 0.9; } 50% { top: 92%; opacity: 0.9; } 100% { top: 4%; opacity: 0.9; } }
    @keyframes sk-pulse-ecg { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
    @keyframes sk-float-slow { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
    @keyframes sk-float-fast { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(-1.5deg); } }
    @keyframes sk-cable-flow { 0% { stroke-dashoffset: 600; } 100% { stroke-dashoffset: 0; } }
    @keyframes sk-radar-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes sk-ppg-glow { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 12px #ff453a); } }
    @keyframes sk-hologram { 0% { opacity: 0.7; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); filter: drop-shadow(0 0 14px rgba(0,177,255,0.6)); } 100% { opacity: 0.7; transform: translateY(0); } }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: sk-marquee 35s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    .marquee-track-rev {
      display: flex;
      width: max-content;
      animation: sk-marquee-rev 42s linear infinite;
    }
    .marquee-track-rev:hover {
      animation-play-state: paused;
    }

    .data-lift {
      transition: transform 240ms cubic-bezier(.22,.61,.36,1), box-shadow 240ms ease, border-color 240ms ease;
    }
    .data-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(82, 79, 217, 0.16);
      border-color: var(--action);
    }

    /* Mobile Responsiveness Overrides */
    @media (max-width: 768px) {
      .dashboard-sidebar {
        display: none !important;
      }
      .mobile-bottom-nav {
        display: flex !important;
      }
      .dashboard-main {
        padding: 16px 16px 80px 16px !important;
      }
      .care-ai-fab {
        bottom: 76px !important;
        right: 16px !important;
        padding: 10px 16px !important;
        font-size: 13px !important;
      }
    }

    @media (min-width: 769px) {
      .mobile-bottom-nav {
        display: none !important;
      }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.04);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(83, 80, 204, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(83, 80, 204, 0.45);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
