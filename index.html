<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary SEO Metadata -->
  <title>Studentkare — Personal Health & Care Services</title>
  <meta name="description" content="Organise your health records, track your recorded measurements, and request products and care from listed providers with Studentkare." />
  <link rel="canonical" href="https://studentkare.in/" />
  
  <!-- SEO & AI Crawler Directives -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- OpenGraph Metadata -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Studentkare" />
  <meta property="og:title" content="Studentkare — Personal Health & Care Services" />
  <meta property="og:description" content="Your records, measurements, and care requests in one authenticated workspace." />
  <meta property="og:url" content="https://studentkare.in/" />
  <meta property="og:image" content="https://studentkare.in/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@studentkare" />
  <meta name="twitter:title" content="Studentkare — Personal Health & Care Services" />
  <meta name="twitter:description" content="Your records, measurements, and care requests in one authenticated workspace." />
  <meta name="twitter:image" content="https://studentkare.in/og.png" />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- JSON-LD Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Studentkare",
    "url": "https://studentkare.in",
    "logo": "https://studentkare.in/logo.png",
    "description": "Personal health records and provider service requests",
    "sameAs": [
      "https://x.com/studentkare",
      "https://github.com/kktejas07/Studentkare",
      "https://linkedin.com/company/studentkare"
    ]
  }
  </script>

  <!-- JSON-LD Structured Data: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Studentkare",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Web",
    "description": "Authenticated health records, manually recorded metrics, and provider service requests"
  }
  </script>

  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f4f6;
      --surface: #ffffff;
      --surface-2: #eceaf5;
      --surface-3: #e7e4fb;
      --rule: #d8d8e3;
      --rule-soft: #e6e6ee;
      --veil: #b9b6e8;
      --ink: #16165c;
      --ink-2: #232269;
      --text: #16165c;
      --text-2: #4a4a63;
      --text-3: #6d6d84;
      --action: #5350cc;
      --on-action: #ffffff;
      --data: #4f4cc9;
      --data-2: #5350cc;
      --art: #8f86d8;
      --art-soft: #b1a6f6;
      --cyan: #00b1ff;
      --positive: #007a55;
      --positive-fill: #00ffaa;
      --attention: #8a5200;
      --attention-fill: #ffb020;
      --emergency: #b3241a;
      --reward: #0e7490;
      --glow: rgba(83, 80, 204, 0.22);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      scroll-behavior: smooth;
      background-color: var(--canvas);
      font-family: "Plus Jakarta Sans", "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
