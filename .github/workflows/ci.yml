name: Studentkare CI & PR Quality Gate

on:
  push:
    branches: [ main, dev, "feat/*" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  pr-quality-gate:
    name: Code Quality, Styles, Dead Code & Unit Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: 1. Code Style & Formatting Check (ESLint)
        run: npm run lint

      - name: 2. TypeScript Type Safety Check
        run: npx tsc --noEmit

      - name: 3. Unwanted & Dead Code Check (Knip)
        run: npx knip --no-exit-code

      - name: 4. Unit Test Suite (Vitest)
        run: npx vitest run

      - name: 5. Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: 6. Backend Python Style & Security Gate (Ruff)
        working-directory: ./backend
        run: ruff check .

      - name: 7. Backend Pytest Suite
        working-directory: ./backend
        run: |
          PYTHONPATH=. pytest tests/ -v
