name: Studentkare CI & PR Quality Gate

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-quality-gate:
    name: Code Quality, Styles, Dead Code, Unit Tests & Production Build
    runs-on: ubuntu-latest
    # The backend suite here runs on SQLite (tests/conftest.py's default). The
    # Postgres-only checks — migrations from an empty database, the versioned
    # schema tests — live in the backend-postgres job below.

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: 1. Code Style & Formatting Check (ESLint)
        run: npm run lint

      # A pull request is compared with the branch it merges into; a push (no
      # base_ref) is compared with main. CI is set, so the script fails if the
      # base cannot be read instead of skipping the comparison.
      - name: 1.2 Lint ratchets only shrink (config/*-legacy.json vs the target branch)
        env:
          LEGACY_BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${LEGACY_BASE_BRANCH}:refs/remotes/origin/${LEGACY_BASE_BRANCH}"
          LEGACY_BASE="origin/${LEGACY_BASE_BRANCH}" npm run lint:ratchet

      # Blocking: no raw hex/rgb()/hsl() colour in src/**/*.css outside the
      # generated token CSS and config/css-colour-legacy.json (shrink-only, 1.2).
      - name: 1.3 Raw colours in CSS (tokens only, DESIGN.md §3)
        run: npm run lint:css-colours

      # Blocking: generated icon code is fresh, and no mapped screen adds a gap
      # beyond config/icon-coverage-legacy.json. The full coverage report runs
      # in the non-blocking design-coverage job, so it can never skip the
      # correctness steps below.
      - name: 1.5 Design-kit icons (generated code fresh; mapped screens add no new gaps)
        run: |
          npm run icons:check
          npm run icons:ratchet

      # Blocking: src/generated/settings.ts is exactly what
      # backend/core/settings_registry.py generates (AGENTS.md rule 11). The
      # registry imports only the standard library, so this needs no backend deps.
      - name: 1.6 Settings registry export fresh (src/generated/settings.ts)
        run: npm run settings:check

      - name: 2. TypeScript Type Safety Check
        run: npx tsc --noEmit

      - name: 2.5 TypeScript Type Safety Check (native app)
        run: npx tsc --noEmit -p config/tsconfig.native.json

      - name: 3. Unwanted & Dead Code Check (Knip)
        run: npx knip --config config/knip.json --no-exit-code

      - name: 4. Unit Test Suite (Vitest)
        run: npx vitest run

      - name: 4.5 Custom House Security Guardrails Check (P72)
        run: npx vitest run src/core/security/__tests__/ciGuardrails.test.ts

      - name: 5. Production Bundle Build
        run: npm run build

      - name: 6. Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f config/requirements-dev.txt ]; then pip install -r config/requirements-dev.txt; fi

      - name: 7. Backend Python Style & Security Gate (Ruff)
        working-directory: ./backend
        run: ruff check .

      - name: 8. Backend Pytest Suite
        working-directory: ./backend
        env:
          # The suite imports `core.*` and `services.*` from the backend root,
          # and its fixtures from tests/ as top-level modules; `app` carries the
          # FastAPI package. PYTHONPATH=. alone resolves none of the latter two,
          # so collection failed before a single test ran.
          PYTHONPATH: .:app:..
        run: pytest tests/ -v

      - name: 9. Secret Scan (gitleaks)
        if: always()
        run: |
          curl -sS -L https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --config=config/gitleaks.toml --source=. --redact --verbose

      - name: 10. Production Startup Guard
        working-directory: ./backend
        run: |
          # Ensures the production config guard refuses to start without required secrets.
          APP_ENV=production OTP_HASH_SECRET='' python -c "from app.main import app" && exit 1 || echo "PASS: production refuses to start without OTP_HASH_SECRET"

      - name: 11. Dependency Audit (npm, non-blocking report)
        run: npm audit --audit-level=high || echo "npm audit reported findings; review before release."

      - name: 12. Docker Compose Config Validation
        run: |
          cp .env.dev.example .env
          docker compose -f docker-compose.yml config >/dev/null
          # Exported (not a one-command prefix) so every prod check below sees them.
          export DATABASE_URL='postgresql://ci:ci@localhost:5432/ci?sslmode=disable' \
            ALLOWED_ORIGINS=https://example.test \
            OTP_HASH_SECRET=dummy-config-check-only \
            ALERTMANAGER_WEBHOOK_SECRET=dummy \
            SENTRY_DSN=https://dummy@sentry.test/1 \
            GRAFANA_ADMIN_PASSWORD=dummy \
            TWO_FACTOR_ENCRYPTION_KEY=dummy \
            PASS_SIGNING_SECRET=dummy \
            DPDP_ARCHIVE_KEY=dummy \
            DPDP_ARCHIVE_RETENTION_DAYS=30 \
            INTEGRATIONS_ENCRYPTION_KEY=dummy
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/compose-prod.yml
          # Uploads fail closed without a virus scanner: prod must run clamd with a health check.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --services | grep -qx clamav
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json clamav \
            | python -c "import json,sys; s=json.load(sys.stdin)['services']['clamav']; assert s['healthcheck']['test'] and s['deploy']['resources']['limits']['memory'], s"
          rm -f .env

  ops-config:
    # Production deploy config: the Helm chart renders and lints with the
    # production values. A chart that cannot render cannot be deployed.
    name: Ops config (Helm chart, env passthrough)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Helm lint + template (production values)
        run: |
          set -euo pipefail
          chart=deploy/helm/studentkare
          args=(-f "$chart/values/production.yaml"
                --set backend.image.tag=sha-ci,frontend.image.tag=sha-ci
                --set backend.secrets.ALERTMANAGER_WEBHOOK_SECRET=ci-dummy
                --set alertmanager.config.global.slack_api_url=https://hooks.slack.test/ci)
          helm lint "$chart" "${args[@]}"
          helm template studentkare "$chart" "${args[@]}" > /tmp/studentkare-rendered.yaml

      - name: No floating image tags (latest, or no tag at all)
        run: |
          set -euo pipefail
          files="docker-compose.yml docker-compose.prod.yml deploy/helm/studentkare/values/production.yaml deploy/Dockerfile deploy/backup/Dockerfile backend/Dockerfile"
          if grep -nE '(^\s*image:\s*[^ :]+(\s|$)|^\s*image:\s*\S+:latest\b|^\s*tag:\s*"?latest"?\s*(#.*)?$|^FROM\s+[^ :]+(\s|$)|^FROM\s+\S+:latest\b)' $files; then
            echo "Pin these image tags."; exit 1
          fi

      - name: nginx config test (the web image's template, rendered by the image's entrypoint)
        run: |
          docker run --rm -e BACKEND_UPSTREAM=127.0.0.1:8000 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/deploy/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            nginx:1.28-alpine nginx -t

      - name: Alert rules and Alertmanager config (promtool / amtool, compose and rendered Helm)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          # Same versions as the prom/prometheus and prom/alertmanager images.
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1 prometheus-2.53.0.linux-amd64/promtool
          curl -sSL https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1 alertmanager-0.27.0.linux-amd64/amtool
          pip install pyyaml
          PATH="$RUNNER_TEMP/bin:$PATH" python scripts/ops/check-monitoring.py

      - name: Env passthrough (every env var the app reads reaches prod compose AND Helm)
        run: |
          pip install pyyaml
          python scripts/ops/check-env-passthrough.py

  expo-bundle:
    # Blocking: the phone app must bundle for both platforms. tsc on the native
    # sources (step 2.5 above) does not catch a Metro/Babel config, alias or
    # missing-package break; only a real export does.
    name: Expo bundle (export android + ios)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Resolved app config (version, build numbers, plugins)
        run: npx expo config --type public --json > /dev/null

      - name: Export Android bundle
        env:
          CI: '1'
          EXPO_PUBLIC_API_BASE_URL: https://api.studentkare.co/api
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-android"

      - name: Export iOS bundle
        env:
          CI: '1'
          EXPO_PUBLIC_API_BASE_URL: https://api.studentkare.co/api
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios"

      - name: Bundle sizes
        run: du -h "$RUNNER_TEMP"/expo-*/_expo/static/js/*/*.hbc

  design-coverage:
    # Report only: how many of the 239 canvas screens are built to their brief.
    # Never blocks a merge; the blocking check is icons:ratchet above.
    name: Design coverage report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Icon coverage across every mapped screen
        run: |
          npm run icons:audit || true
          tail -n +3 design/screens/icon-coverage.md | head -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-coverage
          path: design/screens/icon-coverage.md

  backend-postgres:
    # The suite builds its schema with create_all() on SQLite; production
    # applies Alembic migrations to Postgres and never calls create_all. This
    # job checks the production path: migrate an empty Postgres to head, then
    # run the whole backend suite with DATABASE_URL pointing at it, so
    # services.db_sql's global engine and the Postgres-only schema tests hit a
    # real server. Most tests still build their own in-memory SQLite engines
    # (see tests/conftest.py); this job does not change that.
    # Production runs postgres:16-alpine (docker-compose.yml); 15 stays in the
    # matrix so the migrations keep working on the previous major too.
    name: Backend on Postgres ${{ matrix.postgres }} (migrations from empty + drift check + pytest)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      PYTHONPATH: .:app:..
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      # Postgres-only tests fail rather than skip when the server is missing
      # (tests/postgres_support.py), so a broken service cannot pass as green.
      REQUIRE_POSTGRES: "1"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r config/requirements-dev.txt

      - name: Database starts empty
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from services.db_sql import DATABASE_URL
          tables = inspect(create_engine(DATABASE_URL)).get_table_names()
          assert not tables, f"expected an empty database, found {tables}"
          print("empty database: OK")
          PY

      - name: Alembic upgrade head (from empty)
        run: python -m alembic -c config/alembic.ini upgrade head

      - name: Models vs migrations drift (alembic check)
        # Blocking: a model change without a matching migration fails here.
        run: python -m alembic -c config/alembic.ini check

      - name: Backup and restore drill (pg-backup + restore-check on the migrated schema)
        # docs/guides/backups.md. The runner's client tools are Postgres 16.
        working-directory: .
        run: |
          set -euo pipefail
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          sh deploy/backup/pg-backup.sh
          RESTORE_ADMIN_URL="postgresql://ci:ci@localhost:5432/postgres?sslmode=disable" \
            sh scripts/ops/restore-check.sh

      - name: Backend Pytest Suite on Postgres
        # -rs prints every skip with its reason, so nothing skips silently.
        run: pytest tests/ -q -rs
