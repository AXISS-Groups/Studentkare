# Studentkare Production Helm Values
# Usage: helm install studentkare ./studentkare -f values/production.yaml --namespace studentkare

global:
  environment: production
  cluster: studentkare-prod
  # The one app domain: ingress host, CORS origins, APP_DOMAIN and APP_BASE_URL
  # (email/invite links) all follow it. monitoringDomain is Grafana's root URL.
  domain: studentkare.co
  monitoringDomain: monitoring.studentkare.co
  imagePullSecrets:
    - name: registry-credentials

  # Resource defaults
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 1Gi

  # Security
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

# Backend API Configuration
backend:
  enabled: true
  replicaCount: 3
  image:
    # Pushed by .github/workflows/release.yml. No default tag: pass the commit you
    # deploy, e.g. --set backend.image.tag=sha-<12-char commit> (audit TD-22).
    repository: ghcr.io/axiss-groups/studentkare-backend
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 1Gi
  pgbouncer:
    enabled: true
    image:
      repository: edoburu/pgbouncer
      tag: "v1.25.2-p0"  # pinned; was "latest" (bump deliberately, same as compose)
      pullPolicy: IfNotPresent
    port: 6432
    poolMode: transaction
    maxClientConn: 1000
    defaultPoolSize: 50
  env:
    APP_ENV: production
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    # "mock" refuses to start in production (no real money moves).
    PAYMENT_PROVIDER: razorpay
    # Video consults (docs/video-consults.md). wss:// only; empty = calls off.
    LIVEKIT_URL: ""
    # Agent Ayush (docs/guides/ayush-operations.md). In-cluster Ollama only; empty = quotes + keyword.
    OLLAMA_URL: ""
    LLM_MODEL: ""
    EMBEDDING_PROVIDER: local
    EMBEDDING_MODEL: ""
    EMBEDDING_OLLAMA_URL: ""
    AYUSH_HELP_PACK_AUTOLOAD: "true"
    # Every key below goes into the studentkare-backend-config ConfigMap when it is
    # non-empty; "" leaves the variable unset so the code's default applies.
    # scripts/ops/check-env-passthrough.py keeps this list complete. The app
    # domain and APP_BASE_URL come from global.domain (override APP_BASE_URL here).
    # Integration keys are fallbacks: Admin › Integrations wins.
    ALLOWED_ORIGINS: ""          # default https://<global.domain>
    FORWARDED_ALLOW_IPS: ""      # default the RFC 1918 ranges (ingress pod network)
    APP_BASE_URL: ""             # default https://<global.domain>; links in email and invites
    RULE_L_REQUIRE_GRANTS: "1"
    LLM_TIMEOUT_SECONDS: ""
    # Payments: Student Plus plan id (create it in Razorpay); unpaid-order hold minutes (default 30).
    RAZORPAY_PLUS_PLAN_ID: ""
    RAZORPAY_BASE_URL: ""
    PAYMENT_HOLD_MINUTES: ""
    # ABDM gateway. Empty = not configured; a sandbox URL is refused in production.
    ABDM_BASE_URL: ""
    ABDM_CLIENT_ID: ""
    ABDM_FACILITY_ID: ""
    ABDM_HFR_ENABLED: ""
    ABDM_HFR_REGISTRY_URL: ""
    ABDM_HFR_CLIENT_ID: ""
    # Upload virus scanner and medicine-photo OCR.
    CLAMAV_HOST: ""
    CLAMAV_PORT: ""
    CLAMAV_STRICT: ""
    MEDICINE_OCR_ENABLED: "false"    # tesseract is in the image; stays off until the plan sign-off
    MEDICINE_OCR_TESSERACT: ""
    # Agent Ayush tuning.
    LLM_ENABLED: ""
    LLM_PROVIDER: ""
    LLM_RETRY_AFTER_SECONDS: ""
    EMBEDDING_TIMEOUT_SECONDS: ""
    # Sign-in codes and 2FA.
    OTP_CHANNEL: ""
    OTP_LENGTH: ""
    OTP_TTL_SECONDS: ""
    OTP_MAX_ATTEMPTS: ""
    TWOFA_ENFORCED_ROLES: ""
    TWOFA_ISSUER: ""
    # Delivery channels (secrets are under backend.secrets).
    SMTP_HOST: ""
    SMTP_PORT: ""
    SMTP_TLS: ""
    SMTP_FROM: ""
    SMTP_USERNAME: ""
    DEFAULT_FROM_EMAIL: ""
    POSTAL_ENABLED: ""
    POSTAL_API_URL: ""
    POSTAL_FROM_EMAIL: ""
    OPENWA_ENABLED: ""
    OPENWA_BASE_URL: ""
    OPENWA_SESSION_ID: ""
    OPENWA_DEFAULT_COUNTRY_CODE: ""
    SLACK_ENABLED: ""
    SLACK_DEFAULT_CHANNEL: ""
    SLACK_OPS_CHANNEL: ""
    SLACK_BOOKING_CHANNEL: ""
    # Web Push (services/push_providers.py): the VAPID public key (also served to browsers)
    # and the contact the push services see (mailto: or https://).
    VAPID_PUBLIC_KEY: ""
    VAPID_SUBJECT: ""
    FIREBASE_ENABLED: ""
    FIREBASE_API_KEY: ""         # Firebase web config key (public by design)
    FIREBASE_AUTH_DOMAIN: ""
    FIREBASE_PROJECT_ID: ""
    FIREBASE_MESSAGING_SENDER_ID: ""
    FIREBASE_APP_ID: ""
    FIREBASE_VAPID_KEY: ""
    POSTHOG_ENABLED: ""
    POSTHOG_HOST: ""
    APILAYER_ENABLED: ""
    # Platform identity shown in mail and on the site.
    BRAND_NAME: ""
    PARENT_COMPANY: ""
    SUPPORT_EMAIL: ""
    SUPPORT_PHONE: ""
    COMPANY_ADDRESS: ""
    COPYRIGHT_TEXT: ""
    LOGO_URL: ""
    FAVICON_URL: ""
    # Database pool, API limits (#221: per IP and per account), /metrics allowlist.
    DB_POOL_SIZE: ""
    DB_MAX_OVERFLOW: ""
    RATE_LIMIT_API_PER_IP_PER_MINUTE: ""
    RATE_LIMIT_API_PER_ACCOUNT_PER_MINUTE: ""
    METRICS_ALLOWED_NETWORKS: ""
  # Secrets (populated from Vault/SealedSecrets). A key left "" is not written to
  # the Secret, and the env var stays unset (secretKeyRef is optional).
  secrets:
    DATABASE_URL: ""
    OTP_HASH_SECRET: ""
    SENTRY_DSN: ""
    ALERTMANAGER_WEBHOOK_SECRET: ""   # required; the chart refuses to render without it
    # Fail-closed feature keys (backend and worker). Empty = feature off,
    # reported at startup. Fernet keys:
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    TWO_FACTOR_ENCRYPTION_KEY: ""     # Fernet; enforced roles cannot finish 2FA without it
    PASS_SIGNING_SECRET: ""           # openssl rand -hex 32; check-in passes
    DPDP_ARCHIVE_KEY: ""              # Fernet; DPDP erasure archives
    DPDP_ARCHIVE_RETENTION_DAYS: ""   # whole days; confirm with legal counsel
    INTEGRATIONS_ENCRYPTION_KEY: ""   # Fernet; seals provider secrets
    # Razorpay (docs/billing-payments.md). Empty = online payment off, said so in the app.
    RAZORPAY_KEY_ID: ""               # public key id (rzp_live_...); sent to the browser checkout
    RAZORPAY_KEY_SECRET: ""           # API secret; never leaves the server
    RAZORPAY_WEBHOOK_SECRET: ""       # Dashboard → Webhooks secret (X-Razorpay-Signature)
    # LiveKit (docs/video-consults.md). Empty = no video consult can be started, said so in the app.
    LIVEKIT_API_KEY: ""               # API key id (the token issuer)
    LIVEKIT_API_SECRET: ""            # signs join tokens; never leaves the server
    PAYMENT_WEBHOOK_SECRET: ""        # HMAC secret for the generic signed payment webhook
    ABDM_CLIENT_SECRET: ""            # ABDM gateway client secret
    ABDM_HFR_CLIENT_SECRET: ""        # ABDM Health Facility Registry client secret
    LLM_API_KEY: ""                   # only for a non-Ollama provider (Rule-C: on-prem by default)
    SMTP_PASSWORD: ""
    POSTAL_SERVER_API_KEY: ""
    OPENWA_API_KEY: ""
    SLACK_BOT_TOKEN: ""
    EXPO_ACCESS_TOKEN: ""             # Expo access token (enhanced push security on); empty = no phone push
    VAPID_PRIVATE_KEY: ""             # npx web-push generate-vapid-keys; empty = no browser push
    FIREBASE_SERVER_KEY: ""
    FIREBASE_SERVICE_ACCOUNT_JSON: ""
    POSTHOG_API_KEY: ""
    APILAYER_API_KEY: ""
  service:
    type: ClusterIP
    port: 8000
  healthCheck:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10

# Upload virus scanner (templates/05-clamav.yaml). The backend scans every upload
# over clamd INSTREAM and refuses prescriptions while it is unreachable, so keep it
# enabled. backend.env.CLAMAV_HOST defaults to this Service ("clamav").
clamav:
  enabled: true
  replicaCount: 2
  image:
    repository: clamav/clamav
    tag: "1.4.3"
    pullPolicy: IfNotPresent
  port: 3310
  freshclamChecksPerDay: 12
  # clamd keeps signatures in memory (~1.2 GB) and about doubles while reloading.
  resources:
    limits:
      cpu: "1"
      memory: 3Gi
    requests:
      cpu: 250m
      memory: 1536Mi
  signatureStorage:
    sizeLimit: 2Gi

# Nightly logical Postgres backup (templates/06-backup.yaml, docs/guides/backups.md):
# pg_dump of DATABASE_URL onto the studentkare-backups PVC, kept retentionDays, and
# copied to S3-compatible storage when s3Uri is set. Image from release.yml; its tag
# defaults to backend.image.tag (same commit). Restore drill: restore-check in the image.
backup:
  enabled: true
  schedule: "30 20 * * *"   # 20:30 UTC = 02:00 IST
  retentionDays: 14
  image:
    repository: ghcr.io/axiss-groups/studentkare-backup
    tag: ""                 # "" = backend.image.tag
    pullPolicy: IfNotPresent
  s3Uri: ""                 # e.g. s3://studentkare-backups/postgres
  s3EndpointUrl: ""         # S3-compatible endpoint (MinIO, R2, ...); "" = AWS
  awsRegion: ap-south-1
  secrets:
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
  persistence:
    size: 50Gi
    storageClass: fast-ssd
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Scheduled-jobs worker (templates/04-worker.yaml): backend image, same secrets.
# Required for outbox delivery (SOS) and erasures to happen on a timer.
worker:
  enabled: true
  replicaCount: 1  # more is safe (per-job lease), not needed
  pollSeconds: 15
  terminationGracePeriodSeconds: 120
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Frontend Configuration
frontend:
  enabled: true
  replicaCount: 3
  image:
    # Pushed by .github/workflows/release.yml. No default tag: pass the commit you
    # deploy, e.g. --set frontend.image.tag=sha-<12-char commit> (audit TD-22).
    repository: ghcr.io/axiss-groups/studentkare-frontend
    tag: ""
    pullPolicy: IfNotPresent
  buildArgs:
    VITE_API_BASE_URL: "/api"
  resources:
    limits:
      cpu: "500m"
      memory: 512Mi
    requests:
      cpu: "250m"
      memory: 256Mi
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    limitRps: 100   # per client address; see deploy/nginx.conf
    host: ""          # "" = global.domain
    tls:
      enabled: true
      secretName: studentkare-tls

# PostgreSQL (External Managed - Cloud SQL/RDS)
postgresql:
  enabled: false
  # If using Cloud SQL Proxy:
  # proxy:
  #   enabled: true
  #   instanceConnectionName: "project:region:instance"

# Redis (External Managed - ElastiCache/Memorystore)
redis:
  enabled: false

# OpenTelemetry Collector
otelCollector:
  enabled: true
  replicaCount: 2
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.106.0"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "500m"
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8888
      tempo:
        endpoint: "tempo:4317"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [tempo]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]

# Prometheus
prometheus:
  enabled: true
  replicaCount: 2
  image:
    repository: prom/prometheus
    tag: "v2.53.0"
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 2Gi
  retention: 30d
  retentionSize: 10GB
  storage:
    size: 50Gi
    storageClass: fast-ssd
  config:
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: production
        cluster: studentkare-prod
    rule_files:
      # templates/03-monitoring.yaml mounts the prometheus-rules ConfigMap here.
      - "/etc/prometheus-rules/*.yml"
    scrape_configs:
      - job_name: 'studentkare-backend'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: studentkare-backend
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

# Tempo (Distributed Tracing)
tempo:
  enabled: true
  replicaCount: 2
  image:
    repository: grafana/tempo
    tag: "2.4"
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 100Gi
    storageClass: fast-ssd
  config:
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    limits:
      max_bytes_per_trace: 1000000

# Loki (Log Aggregation)
loki:
  enabled: true
  replicaCount: 2
  image:
    repository: grafana/loki
    tag: "2.9"
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 50Gi
    storageClass: fast-ssd
  config:
    auth_enabled: false
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 20
      ingestion_burst_size_mb: 40
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

# Promtail (Log Shipping)
promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "2.9"
  resources:
    limits:
      cpu: "500m"
      memory: 256Mi
    requests:
      cpu: "100m"
      memory: 128Mi
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - json:
              expressions:
                timestamp: timestamp
                level: level
                logger: name
                message: message
          - timestamp:
              source: timestamp
              format: RFC3339
          - labels:
              level:
              logger:
              pod:
              namespace:
              app:

# Grafana
grafana:
  enabled: true
  replicaCount: 1
  image:
    repository: grafana/grafana
    tag: "10.4.0"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "500m"
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: fast-ssd
  adminPassword: "" # From secret
  config:
    security:
      admin_user: admin
    server:
      root_url: ""    # "" = https://<global.monitoringDomain>
    users:
      allow_sign_up: false
    auth:
      disable_login_form: false
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
      - name: Tempo
        type: tempo
        url: http://tempo:3200
        access: proxy
    dashboards:
      default:
        studentkare-api-overview:
          json: |
            {{ .Files.Get "files/dashboards/api-overview.json" | indent 10 }}
        studentkare-db-connections:
          json: |
            {{ .Files.Get "files/dashboards/db-connections.json" | indent 10 }}
        studentkare-error-tracking:
          json: |
            {{ .Files.Get "files/dashboards/error-tracking.json" | indent 10 }}
        studentkare-business-ops:
          json: |
            {{ .Files.Get "files/dashboards/business-ops.json" | indent 10 }}

# Alertmanager
alertmanager:
  enabled: true
  replicaCount: 2
  image:
    repository: prom/alertmanager
    tag: "v0.27.0"
  resources:
    limits:
      cpu: "500m"
      memory: 256Mi
    requests:
      cpu: "100m"
      memory: 128Mi
  persistence:
    enabled: true
    size: 2Gi
  config:
    global:
      resolve_timeout: 5m
      # The Slack incoming-webhook URL. Written to studentkare-secrets as
      # SLACK_WEBHOOK_URL and mounted for slack_api_url_file; required.
      slack_api_url: ""
    route:
      group_by: ['alertname', 'severity', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-ops'
    receivers:
      - name: 'slack-ops'
        slack_configs:
          - channel: '#ops-alerts'
            send_resolved: true
            title: '[{{ .Status }}] {{ .Labels.alertname }} - {{ .Labels.severity | upper }}'

# Blackbox Exporter (Synthetic Monitoring)
blackbox:
  enabled: true
  replicaCount: 2
  image:
    repository: prom/blackbox-exporter
    tag: "0.25"
  resources:
    limits:
      cpu: "250m"
      memory: 128Mi
    requests:
      cpu: "100m"
      memory: 64Mi
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200]
      tcp_connect:
        prober: tcp
        timeout: 5s

# Service Monitor for Prometheus Operator
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

# Pod Monitor for Prometheus Operator
podMonitor:
  enabled: true

# Network Policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: studentkare-frontend
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

# Pod Disruption Budgets
pdb:
  enabled: true
  backend:
    minAvailable: 2
  frontend:
    minAvailable: 2
  prometheus:
    minAvailable: 1
  loki:
    minAvailable: 1
  tempo:
    minAvailable: 1