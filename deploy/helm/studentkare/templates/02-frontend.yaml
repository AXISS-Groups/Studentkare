apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentkare-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: studentkare-frontend
    app.kubernetes.io/name: studentkare
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: studentkare-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: studentkare-frontend
        app.kubernetes.io/name: studentkare
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "Set frontend.image.tag to a released sha-<commit> tag (see release.yml)" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            # deploy/nginx.conf proxies /api here (the compose default is backend:8000).
            - name: BACKEND_UPSTREAM
              value: "studentkare-backend:{{ .Values.backend.service.port }}"
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # nginx writes its rendered config, cache and pid file; the root is read-only.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: studentkare-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: studentkare-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: studentkare-frontend
---
{{- if .Values.frontend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studentkare-frontend
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.frontend.ingress.className }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Edge flood backstop per client address, sized for campus NAT (deploy/nginx.conf
    # has the same limit; the app's own per-IP and per-session limits from #221 bite first).
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.frontend.ingress.limitRps | default 100 | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: {{ .Values.frontend.ingress.className }}
  tls:
    {{- if .Values.frontend.ingress.tls.enabled }}
    - hosts:
        - {{ .Values.frontend.ingress.host | default .Values.global.domain }}
      secretName: {{ .Values.frontend.ingress.tls.secretName }}
    {{- end }}
  rules:
    - host: {{ .Values.frontend.ingress.host | default .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studentkare-frontend
                port:
                  number: 80
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: studentkare-frontend-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.pdb.frontend.minAvailable | default 2 }}
  selector:
    matchLabels:
      app: studentkare-frontend