apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    name: {{ .Release.Namespace }}
    environment: {{ .Values.global.environment }}
    app.kubernetes.io/managed-by: Helm
---
apiVersion: v1
kind: Secret
metadata:
  name: studentkare-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ALERTMANAGER_WEBHOOK_SECRET: {{ required "Set backend.secrets.ALERTMANAGER_WEBHOOK_SECRET: without it the alert webhook refuses every alert (audit ENV-05)" .Values.backend.secrets.ALERTMANAGER_WEBHOOK_SECRET | quote }}
  {{- range $key, $value := .Values.backend.secrets }}
  {{- if and (ne $key "ALERTMANAGER_WEBHOOK_SECRET") (ne (toString $value) "") }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
  SLACK_WEBHOOK_URL: {{ .Values.alertmanager.config.global.slack_api_url | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | quote }}
{{- if and .Values.tls .Values.tls.crt }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.crt | b64enc | quote }}
  tls.key: {{ .Values.tls.key | b64enc | quote }}
{{- end }}
