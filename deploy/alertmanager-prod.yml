global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL:?Set SLACK_WEBHOOK_URL from vault}

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-ops'
  routes:
    - match:
        severity: critical
      receiver: 'slack-ops'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-ops'
    - match:
        alertname: Watchdog
      receiver: 'slack-ops'

receivers:
  - name: 'slack-ops'
    slack_configs:
      - channel: '#ops-alerts'
        title: '[{{ .Status }}] {{ .Labels.alertname }} - {{ .Labels.severity | upper }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':rotating_light:'
        username: 'Studentkare Alertmanager'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance', 'service']