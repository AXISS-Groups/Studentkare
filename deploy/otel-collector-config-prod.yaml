receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: 0.0.0.0:8888
    namespace: studentkare
    resource_to_telemetry_conversion:
      enabled: true

  tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [tempo, logging]
    metrics:
      receivers: [otlp]
      exporters: [prometheus, logging]