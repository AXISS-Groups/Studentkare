# Web container (deploy/Dockerfile). The nginx image renders this template with
# envsubst at start (/etc/nginx/templates): ${BACKEND_UPSTREAM} is the API
# address, "backend:8000" in compose (Dockerfile default) and the backend Service
# in Helm. nginx's own $variables are left alone (only set env vars are replaced).

# Client address: behind the TLS terminator / ingress (private networks), take it
# from X-Forwarded-For so rate limits key on the student, not the proxy. A direct
# client cannot spoof this: its own address is not in these ranges.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Edge rate limit on /api, per client address: a flood backstop only. A campus
# NAT puts hundreds of students behind one address, so it sits above the app's
# own limits (#221: platform.api_rate_per_ip_per_minute, default 3000/min per API
# replica, and 300/min per signed-in session) and never bites before them:
# 100 r/s = 6000/min, with a burst of 500 for page loads that fire many calls.
limit_req_zone $binary_remote_addr zone=sk_api:20m rate=100r/s;
limit_req_status 429;
limit_req_log_level warn;

# Link-preview crawlers (they run no JavaScript, so the app shell would show the
# site's defaults). Matched by user agent only; a person's browser never is.
# Their requests for a post page get the post's Open Graph tags from the API
# (services/newsroom_content.link_preview); tests/test_newsroom_content.py
# keeps this list and the location below in step with the API route.
map $http_user_agent $sk_link_preview {
    default 0;
    "~*(LinkedInBot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|TelegramBot|Slackbot|Discordbot|SkypeUriPreview|redditbot|Pinterestbot|Embedly)" 1;
}

# Compression. Brotli is not compiled into the nginx image; gzip only.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/manifest+json image/svg+xml application/xml font/ttf font/otf;
gzip_static on;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # Uploads go to /api (below); nothing else takes a body.
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Prescription and photo uploads (same limit as the Helm ingress).
        client_max_body_size 12m;
        limit_req zone=sk_api burst=500 nodelay;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 25s;
    }

    # App link files (deploy/well-known/README.md): real files only, never the SPA.
    location = /.well-known/apple-app-site-association {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        try_files $uri =404;
    }

    location /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # The newsroom's sitemap (published posts), served by the API (services/newsroom.py).
    # /api/ is disallowed in robots.txt, so crawlers get it at the site root.
    location = /sitemap-posts.xml {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=sk_api burst=500 nodelay;
        proxy_pass http://${BACKEND_UPSTREAM}/api/posts/sitemap.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 25s;
    }

    # A post page (/blog/{slug}, /news/{slug}): link-preview crawlers get the
    # post's meta tags from the API; everyone else gets the app shell, as below.
    # The rewrite keeps proxy_pass free of variables (no resolver needed).
    location ~ "^/(blog|news)/([a-z0-9]+(?:-[a-z0-9]+)*)/?$" {
        include /etc/nginx/snippets/security-headers.conf;
        set $sk_post_section $1;
        set $sk_post_slug $2;
        error_page 418 = @sk_post_preview;
        if ($sk_link_preview) {
            return 418;
        }
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }

    location @sk_post_preview {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=sk_api burst=500 nodelay;
        rewrite ^ /api/posts/$sk_post_section/$sk_post_slug/preview.html? break;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 25s;
    }

    # Content-hashed build output (Vite) and hashed public media: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Not "always": a 404 (say, mid-rollout) must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The app shell and the files that point at hashed assets: always revalidate,
    # so a deploy is picked up on the next load. Includes the prerendered pages.
    location ~* (\.html|/sw\.js|\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else: unhashed public files (icons, fonts, robots.txt) for an
    # hour; unknown paths fall back to the app shell (no-cache, above).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }
}
