server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
