# Included in every location of deploy/nginx.conf (add_header in a location
# replaces the server's, so each location includes this file).
#
# CSP, from what the built app loads (checked against `vite build` output):
#   script   self; Razorpay Checkout; mp4box (cdn.jsdelivr.net) and jsPDF
#            (cdnjs.cloudflare.com), loaded on demand; PostHog's lazy scripts
#   style    self + inline (react-native-web injects <style>; index.html has one);
#            Google Fonts CSS; the GenoTrace webfont
#   connect  self; Sentry ingest; PostHog; Razorpay; LiveKit (wss:, host is
#            configurable); the GenoTrace video CDN
#   frame    Razorpay Checkout
# A new third-party origin needs a line here, or the browser blocks it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://db.onlinewebfonts.com; font-src 'self' data: https://fonts.gstatic.com https://db.onlinewebfonts.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self' https://*.sentry.io https://*.posthog.com https://api.razorpay.com https://lumberjack.razorpay.com https://cdn.jsdelivr.net https://d8j0ntlcm91z4.cloudfront.net wss:; frame-src https://checkout.razorpay.com https://api.razorpay.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
# Browsers only honour HSTS over HTTPS, i.e. behind the TLS terminator / ingress.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera (prescription photos), microphone (video consults), location (find care), payments.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self \"https://checkout.razorpay.com\"), usb=(), serial=(), bluetooth=()" always;
