server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: studentkare-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: studentkare-backend
          service: backend
          environment: development
          __path__: /var/log/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: name
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          logger:

  - job_name: studentkare-nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: studentkare-nginx
          service: frontend
          environment: development
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - timestamp:
          source: time_local
          format: '02/Jan/2006:15:04:05 -0700'
      - labels:
          status: