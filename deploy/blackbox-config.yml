modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      headers:
        User-Agent: "Studentkare-Blackbox/1.0"
      fail_if_not_matches_regexp:
        - "Studentkare|healthy"

  http_post_2xx:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      valid_status_codes: [200, 201]
      method: POST
      headers:
        Content-Type: "application/json"
        User-Agent: "Studentkare-Blackbox/1.0"

  tcp_connect:
    prober: tcp
    timeout: 5s

  grpc:
    prober: grpc
    timeout: 10s
    grpc:
      service: ""
      tls: false

  dns_tcp:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: tcp
      query_type: "A"

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      payload_size: 56