            + (n.missing
              ? 'background: #FBF3F1; border: 2px dashed #D4A29E;'
              : 'background: #FFFFFF; border: 1px solid #EEF2FF;'),
          titleStyle: 'font-size: 14px; font-weight: 800; color: ' + (n.missing ? '#D97706;' : '#131B2E;'),
          metaStyle: 'font-size: 11px; font-weight: 600; color: ' + (n.missing ? '#B07A5C;' : '#777587;')
        });
      });
    });

    function edge(a, b, colour, dashed) {
      var A = pos[a], B = pos[b];
      if (!A || !B) return null;
      var d;
      if (Math.abs(A.y - B.y) < 2) {
        d = 'M ' + (A.x + A.w) + ' ' + (A.y + A.h / 2) + ' L ' + B.x + ' ' + (B.y + B.h / 2);
      } else {
        var sx = A.x + A.w / 2, sy = A.y + A.h, ex = B.x + B.w / 2, ey = B.y;
        var mid = sy + (ey - sy) / 2;
        d = 'M ' + sx + ' ' + sy + ' C ' + sx + ' ' + mid + ', ' + ex + ' ' + mid + ', ' + ex + ' ' + ey;
      }
      return {
        d: d,
        stroke: colour,
        dash: dashed ? '7 7' : '0',
        style: dashed
          ? 'animation: skDash 1.4s linear infinite;'
          : 'stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: skDraw 1.1s both ease-out; animation-delay: .35s;'
      };
    }

    var edges = [];
    lanes.forEach(function (lane) {
      var row = lane.rows[0];
      for (var i = 0; i < row.length - 1; i++) {
        if (row[i].missing || row[i + 1].missing) continue;
        var e = edge(row[i].id, row[i + 1].id, '#4F46E5', false);
        if (e) edges.push(e);
      }
    });

    [['signin', 'create'], ['ready', 'home'], ['home', 'sentry'], ['home', 'shop'], ['ok', 'track'],
     ['home', 'care'], ['myrep', 'rins'], ['care', 'tele'], ['more', 'sprof'], ['sres', 'lab'],
     ['whome', 'wsign'], ['wsign', 'wdash'], ['wdash', 'wacct'], ['wvault', 'clin'], ['labq', 'rrev'],
     ['pay', 'vend'], ['vend', 'settle'], ['sadmin', 'claims']]
      .forEach(function (p) {
        var e = edge(p[0], p[1], '#C3C0FF', true);
        if (e) edges.push(e);
      });

    return { nodes: nodes, edges: edges, lanes: laneChips };
  }
}
</script>
