<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upload a prescription</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}
@keyframes skFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes skScan{0%{top:14%}50%{top:76%}100%{top:14%}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 16px; background: #FFFFFF; border-bottom: 1px solid #EEF2FF; display: flex; align-items: center; gap: 12px;">
    <a href="Medications.dc.html" aria-label="Back" style="width: 38px; height: 38px; border-radius: 999px; background: #F2F3FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </a>
    <span style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 19px; font-weight: 800; color: #131B2E; letter-spacing: -0.4px;">Upload prescription</span>
      <span style="font-size: 12px; font-weight: 500; color: #464555;">Needed for scheduled medicines only</span>
    </span>
  </div>

  <div style="padding: 20px 20px 0;">
    <div style="position: relative; height: 216px; border-radius: 22px; border: 2px dashed #C7C4D8; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; animation: skRise .5s .05s both cubic-bezier(.2,.7,.3,1);">
      <span style="position: absolute; left: 10%; right: 10%; height: 2px; border-radius: 999px; background: #3525CD; opacity: .45; animation: skScan 3.2s ease-in-out infinite;" aria-hidden="true"></span>
      <span style="width: 68px; height: 68px; border-radius: 22px; background: #EEF2FF; color: #3525CD; display: flex; align-items: center; justify-content: center; animation: skFloat 4s ease-in-out infinite;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span style="font-size: 15px; font-weight: 700; color: #131B2E;">Take a photo or pick a file</span>
        <span style="font-size: 12.5px; font-weight: 500; color: #464555;">JPG, PNG or PDF · up to 10 MB</span>
      </span>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; gap: 11px; animation: skFade .5s .2s both;">
    <a href="Checkout.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 999px; background: #3525CD; font-size: 14.5px; font-weight: 800; color: #FFFFFF;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"></path><circle cx="12" cy="13" r="3.4"></circle></svg>
      Camera
    </a>
    <span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EEF2FF; font-size: 14.5px; font-weight: 700; color: #131B2E;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#464555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 15V3M8 7l4-4 4 4"></path></svg>
      Files
    </span>
  </div>

  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 11px;">
    <span style="font-size: 12px; font-weight: 800; color: #464555; letter-spacing: 1.1px; animation: skFade .4s .28s both;">WHAT MAKES IT VALID</span>
    <sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
      <div style="{{ r.rowStyle }}">
        <span style="width: 22px; height: 22px; border-radius: 999px; background: #EEF2FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3525CD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        </span>
        <span style="font-size: 13px; line-height: 1.5; font-weight: 500; color: #464555;">{{ r.text }}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 22px; animation: skFade .5s .5s both;">
    <div style="display: flex; gap: 11px; padding: 15px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EEF2FF;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3525CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span style="font-size: 11.5px; line-height: 1.55; font-weight: 500; color: #464555;">A registered pharmacist reviews every upload. The file goes to your vault, not to the shop — it is never used to pick what you are shown.</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rules = [
      'The doctor\u2019s name, registration number and signature are visible',
      'The date is within the last 6 months',
      'Your name matches the account name',
      'The whole page is in frame and in focus'
    ];
    return {
      rules: rules.map((text, i) => ({
        text: text,
        rowStyle: 'display: flex; align-items: flex-start; gap: 11px; animation: skRise .45s both cubic-bezier(.2,.7,.3,1); animation-delay: '
          + (0.32 + i * 0.06).toFixed(2) + 's;'
      }))
    };
  }
}
</script>
</body>
</html>
