<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track your order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}
@keyframes skGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes skHalo{0%{transform:scale(.9);opacity:.55}70%{transform:scale(2.1);opacity:0}100%{transform:scale(2.1);opacity:0}}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 18px; background: #1E1B4B; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="OrderSuccess.dc.html" aria-label="Back" style="width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
      </a>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.3px;">Order SK-48120</span>
        <span style="font-size: 12px; font-weight: 500; color: #C3C0FF;">2 items · ₹578 paid</span>
      </span>
      <span style="display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.16);">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #FFFFFF; animation: skPulse 1.5s ease-in-out infinite;"></span>
        <span style="font-size: 10.5px; font-weight: 800; color: #FFFFFF; letter-spacing: 0.6px;">LIVE</span>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px;">
      <span style="font-size: 24px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.6px;">Arriving by 8:40 PM</span>
      <span style="font-size: 13px; font-weight: 500; color: #C3C0FF;">Runner is 6 minutes from Block B lobby</span>
    </div>
  </div>

  <div style="padding: 22px 20px 0; display: flex; flex-direction: column;">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
      <div style="{{ s.rowStyle }}">
        <span style="display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0;">
          <span style="{{ s.markWrapStyle }}">
            <span style="{{ s.haloStyle }}"></span>
            <span style="{{ s.markStyle }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="{{ s.tickStyle }}" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
            </span>
          </span>
          <span style="{{ s.lineStyle }}"></span>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding-bottom: 26px;">
          <span style="{{ s.titleStyle }}">{{ s.title }}</span>
          <span style="font-size: 12.5px; line-height: 1.45; font-weight: 500; color: #464555;">{{ s.meta }}</span>
        </span>
        <span style="font-size: 12px; font-weight: 700; color: #6B6980; flex-shrink: 0;">{{ s.time }}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 4px 20px 0; animation: skRise .55s .4s both cubic-bezier(.2,.7,.3,1);">
    <div style="display: flex; align-items: center; gap: 13px; padding: 15px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EEF2FF;">
      <span style="width: 46px; height: 46px; border-radius: 999px; background: #EEF2FF; color: #3525CD; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 800;">RP</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 14.5px; font-weight: 700; color: #131B2E;">Ramesh P.</span>
        <span style="font-size: 12px; font-weight: 500; color: #464555;">Campus pharmacy runner</span>
      </span>
      <span style="width: 44px; height: 44px; border-radius: 999px; background: #3525CD; display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h3.5l1.6 4-2.2 1.4a11.5 11.5 0 0 0 5.7 5.7L15 12.9l4 1.6V18a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 3 6.2 2 2 0 0 1 5 4z"></path></svg>
      </span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 20px; display: flex; gap: 11px; animation: skFade .5s .55s both;">
    <a href="OrderHistory.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EEF2FF; font-size: 14px; font-weight: 700; color: #131B2E;">All my orders</a>
    <a href="MoreHub.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #FFFFFF; border: 1px solid #FFE4E6; font-size: 14px; font-weight: 700; color: #BE123C;">Report an issue</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { title: 'Order placed', meta: 'Paid ₹578 via UPI', time: '8:02 PM', state: 'done' },
      { title: 'Pharmacist verified', meta: 'Both items over-the-counter, no prescription needed', time: '8:09 PM', state: 'done' },
      { title: 'Packed at campus pharmacy', meta: 'Sealed and labelled for Block B', time: '8:21 PM', state: 'done' },
      { title: 'Out for delivery', meta: 'Ramesh P. is 6 minutes from your lobby', time: 'Now', state: 'active' },
      { title: 'Delivered to Block B', meta: 'Collect from the lobby desk', time: '8:40 PM', state: 'todo' }
    ];
    return {
      steps: rows.map((r, i) => {
        var done = r.state === 'done';
        var active = r.state === 'active';
        var last = i === rows.length - 1;
        return {
          title: r.title,
          meta: r.meta,
          time: r.time,
          rowStyle: 'display: flex; gap: 14px; animation: skRise .5s both cubic-bezier(.2,.7,.3,1); animation-delay: ' + (0.08 + i * 0.09).toFixed(2) + 's;',
          markWrapStyle: 'position: relative; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;',
          haloStyle: active
            ? 'position: absolute; width: 26px; height: 26px; border-radius: 999px; background: #3525CD; animation: skHalo 2s ease-out infinite;'
            : 'display: none;',
          markStyle: 'position: relative; width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; '
            + (done || active ? 'background: #3525CD;' : 'background: #FFFFFF; border: 2px solid #C7C4D8;'),
          tickStyle: done ? '' : 'display: none;',
          lineStyle: last
            ? 'display: none;'
            : 'width: 2px; flex-grow: 1; min-height: 34px; transform-origin: top; background: ' + (done ? '#3525CD' : '#DAE2FD')
              + '; animation: skGrowY .5s both ease-out; animation-delay: ' + (0.16 + i * 0.09).toFixed(2) + 's;',
          titleStyle: 'font-size: 14.5px; font-weight: ' + (active ? '800' : '700') + '; color: ' + (r.state === 'todo' ? '#777587;' : '#131B2E;')
        };
      })
    };
  }
}
</script>
</body>
</html>
