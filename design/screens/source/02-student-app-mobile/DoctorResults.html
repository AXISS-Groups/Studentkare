<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doctors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#4F46E5;text-decoration:none}a:hover{color:#3525CD}
@keyframes skRiseA{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes skRiseB{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}
@keyframes skScrim{from{opacity:0}to{opacity:1}}
@keyframes skSheet{from{transform:translateY(102%)}to{transform:translateY(0)}}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.35}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 944px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 24px 24px 0; display: flex; align-items: center; gap: 14px; animation: skFade .4s both;">
    <a href="SearchResults.dc.html" aria-label="Back" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; margin-left: -8px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </a>
    <span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #464555;">Doctors</span>
    <button type="button" onClick="{{ openFilter }}" style="{{ filterBtnStyle }}">{{ filterLabel }}</button>
  </div>

  <div style="margin: 18px 24px 0; height: 156px; padding-left: 20px; border-radius: 22px; background: #EEF2FF; display: flex; align-items: center; gap: 6px; overflow: hidden; animation: skFade .45s .05s both;">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 11px; font-weight: 800; color: #6B6980; letter-spacing: 1.2px;">{{ eyebrow }}</span>
    <span style="font-size: 24px; line-height: 1.15; font-weight: 800; color: #131B2E; letter-spacing: -0.8px;">{{ heading }}</span>
    </div>
    <img src="/_blob/82be0fecb9240e6409dc67193b2bce8e" alt="A doctor on a screen" style="align-self: flex-end; height: 156px; width: auto; flex-shrink: 0; ">
  </div>

  <div style="padding: 22px 24px 0; display: flex; flex-direction: column;">
    <sc-for list="{{ docs }}" as="d" hint-placeholder-count="4">
      <div style="{{ d.rowStyle }}">
        <span style="{{ d.avatarStyle }}">{{ d.initials }}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
          <span style="display: flex; align-items: baseline; gap: 8px;">
            <span style="font-size: 15px; font-weight: 700; color: #131B2E;">{{ d.name }}</span>
            <span style="{{ d.dotStyle }}"></span>
          </span>
          <span style="font-size: 11.5px; font-weight: 500; color: #6B6980;">{{ d.spec }}</span>
          <span style="font-size: 11.5px; font-weight: 600; color: #464555;">{{ d.when }}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;">
          <span style="{{ d.feeStyle }}">{{ d.fee }}</span>
          <button type="button" onClick="{{ d.book }}" style="{{ d.ctaStyle }}">Book</button>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 24px 22px; animation: skFade .5s .4s both;">
    <span style="font-size: 11.5px; line-height: 1.6; font-weight: 500; color: #6B6980;">Every clinician here is NMC registered and the number is on their prescription. Ordering is by availability and distance — never by who pays us.</span>
  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ true }}">
    <span style="position: absolute; inset: 0; background: rgba(19,27,46,0.34); animation: skScrim .3s both;" aria-hidden="true"></span>
    <div style="{{ sheetStyle }}">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: rgba(19,27,46,0.16);"></span>
      <span style="font-size: 19px; font-weight: 800; color: #131B2E; letter-spacing: -0.4px;">{{ sheetTitle }}</span>
      <span style="font-size: 12.5px; line-height: 1.5; font-weight: 500; color: #464555;">{{ sheetSub }}</span>
      <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
        <button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">
          <span style="{{ o.markStyle }}"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; text-align: left;">
            <span style="font-size: 14px; font-weight: 700; color: #131B2E;">{{ o.label }}</span>
            <span style="font-size: 11.5px; line-height: 1.4; font-weight: 500; color: #464555;">{{ o.meta }}</span>
          </span>
          <span style="{{ o.tagStyle }}">{{ o.tag }}</span>
        </button>
      </sc-for>
      <a href="{{ confirmHref }}" style="margin-top: 2px; display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 999px; background: #4F46E5; font-size: 14.5px; font-weight: 800; color: #FFFFFF;">{{ confirmLabel }}</a>
      <button type="button" onClick="{{ close }}" style="height: 40px; border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; color: #6B6980;">Close</button>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":944}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: 'filter', filter: 0, doc: 0, slot: 0 };
  }
  renderVals() {
    var self = this, st = this.state;

    var filters = [
      { label: 'Available today', meta: 'Video or campus clinic', tag: '' },
      { label: 'General medicine', meta: 'Fever, infections, everyday illness', tag: '' },
      { label: 'Mental health', meta: 'Counsellors and psychiatrists', tag: 'FREE' },
      { label: 'Women’s health', meta: 'Gynaecology and SRH', tag: '' }
    ];

    var allDocs = [
      { initials: 'AR', name: 'Dr. Ananya Reddy', spec: 'MD Internal Medicine · NMC-TS-88412', when: 'Free at 4:30 PM today', fee: 'Free', live: true, free: true, kind: 1 },
      { initials: 'SR', name: 'Dr. Sneha Reddy', spec: 'Adolescent psychiatry · NMC-TS-71029', when: 'Free at 6:00 PM today', fee: 'Free', live: true, free: true, kind: 2 },
      { initials: 'VR', name: 'Dr. Vikramaditya Rao', spec: 'General medicine · NMC-TS-60881', when: 'Tomorrow, 9:15 AM', fee: '₹199', live: false, free: false, kind: 1 },
      { initials: 'KM', name: 'Dr. Kavya Menon', spec: 'Gynaecology · NMC-TS-51170', when: 'Thursday, 11:00 AM', fee: '₹249', live: false, free: false, kind: 3 }
    ];

    var docs = st.filter === 0 ? allDocs.filter(function (d) { return d.live; }) : allDocs.filter(function (d) { return d.kind === st.filter; });
    if (!docs.length) docs = allDocs;

    var slots = [
      { label: 'Today, 4:30 PM', meta: 'Video consult · 15 minutes', tag: 'FREE' },
      { label: 'Today, 6:15 PM', meta: 'Video consult · 15 minutes', tag: 'FREE' },
      { label: 'Tomorrow, 9:00 AM', meta: 'Campus clinic, Block C', tag: '' }
    ];

    var open = st.sheet;
    var isFilter = open === 'filter';
    var conf = isFilter
      ? { title: 'Narrow it down', sub: docs.length + ' clinicians match right now.', options: filters, key: 'filter', confirm: 'Show ' + docs.length + ' clinicians' }
      : { title: 'Book with ' + allDocs[st.doc].name.replace('Dr. ', 'Dr. '), sub: 'Price shown before you book. Campus is never told you booked.', options: slots, key: 'slot', confirm: 'Confirm ' + slots[st.slot].label };

    return {
      eyebrow: st.filter === 0 ? 'ON SHIFT NOW' : 'FILTERED',
      heading: docs.length + (docs.length === 1 ? ' clinician' : ' clinicians'),
      filterLabel: st.filter === 0 ? 'Filter' : filters[st.filter].label,
      filterBtnStyle: 'height: 34px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 800; '
        + (st.filter === 0 ? 'background: #EEF2FF; color: #3525CD;' : 'background: #4F46E5; color: #FFFFFF;'),
      openFilter: () => self.setState({ sheet: 'filter' }),
      close: () => self.setState({ sheet: null }),
      docs: docs.map(function (d, i) {
        var realIndex = allDocs.indexOf(d);
        return {
          initials: d.initials, name: d.name, spec: d.spec, when: d.when, fee: d.fee,
          book: () => self.setState({ sheet: 'book', doc: realIndex }),
          rowStyle: 'display: flex; align-items: center; gap: 13px; padding: 15px 0; border-bottom: 1px solid #EEF2FF; animation: '
            + (i % 2 ? 'skRiseB' : 'skRiseA') + ' .5s both cubic-bezier(.2,.7,.3,1); animation-delay: ' + (0.12 + i * 0.06).toFixed(2) + 's;',
          avatarStyle: 'width: 46px; height: 46px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #EEF2FF; font-size: 14px; font-weight: 800; color: #3525CD;',
          dotStyle: d.live ? 'width: 6px; height: 6px; border-radius: 999px; background: #059669; animation: skPulse 1.7s ease-in-out infinite;' : 'display: none;',
          feeStyle: 'font-size: 12.5px; font-weight: 800; color: ' + (d.free ? '#059669;' : '#131B2E;'),
          ctaStyle: 'height: 34px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit; background: #4F46E5; font-size: 12.5px; font-weight: 800; color: #FFFFFF;'
        };
      }),
      sheetOpen: !!open,
      sheetTitle: conf.title,
      sheetSub: conf.sub,
      confirmLabel: conf.confirm,
      confirmHref: isFilter ? 'DoctorResults.dc.html' : 'Teleconsult.dc.html',
      sheetStyle: 'position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0; padding: 12px 22px 18px; display: flex; flex-direction: column; gap: 11px; '
        + 'background: rgba(255,255,255,0.78); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); '
        + 'border-top: 1px solid rgba(255,255,255,0.8); box-shadow: 0 -10px 34px rgba(19,27,46,0.16); animation: skSheet .42s both cubic-bezier(.2,.8,.3,1);',
      options: conf.options.map(function (o, i) {
        var on = st[conf.key] === i;
        return {
          label: o.label, meta: o.meta, tag: o.tag,
          pick: () => { var p = {}; p[conf.key] = i; self.setState(p); },
          style: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 15px; cursor: pointer; font-family: inherit; background: rgba(255,255,255,0.72); border: '
            + (on ? '1.5px solid #4F46E5;' : '1px solid rgba(19,27,46,0.08);'),
          markStyle: 'width: 18px; height: 18px; border-radius: 999px; flex-shrink: 0; border: ' + (on ? '5.5px solid #4F46E5;' : '2px solid #C7C4D8;'),
          tagStyle: o.tag ? 'padding: 3px 9px; border-radius: 999px; background: #ECFDF5; font-size: 9px; font-weight: 800; color: #047857; letter-spacing: 0.4px;' : 'display: none;'
        };
      })
    };
  }
}
</script>
</body>
</html>
