<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search suggestions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}
@keyframes skCaret{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 16px; background: #FFFFFF; border-bottom: 1px solid #EEF2FF; display: flex; align-items: center; gap: 12px;">
    <a href="SearchEntry.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #F2F3FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 15px; background: #FFFFFF; border: 2px solid #3525CD;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3525CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      <span style="display: flex; align-items: center; flex-grow: 1;">
        <span style="font-size: 15px; font-weight: 600; color: #131B2E;">vitamin</span>
        <span style="width: 2px; height: 19px; background: #3525CD; margin-left: 2px; animation: skCaret 1.05s steps(1) infinite;" aria-hidden="true"></span>
      </span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#777587" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; align-items: center; gap: 8px; animation: skFade .35s both;">
      <span style="width: 7px; height: 7px; border-radius: 999px; background: #3525CD; animation: skPulse 1.2s ease-in-out infinite;" aria-hidden="true"></span>
      <span style="font-size: 12px; font-weight: 800; color: #464555; letter-spacing: 1.1px;">SUGGESTIONS</span>
    </div>

    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="6">
        <a href="SearchLoading.dc.html" style="{{ s.rowStyle }}">
          <span style="{{ s.iconStyle }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ s.path }}"></path></svg>
          </span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 14.5px; font-weight: 600; color: #131B2E;"><strong style="font-weight: 800;">vitamin</strong>{{ s.tail }}</span>
            <span style="font-size: 12px; font-weight: 500; color: #6B6980;">{{ s.kind }}</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7C4D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7H7M17 7v10"></path></svg>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px; animation: skRise .5s .4s both cubic-bezier(.2,.7,.3,1);">
      <span style="font-size: 12px; font-weight: 800; color: #464555; letter-spacing: 1.1px;">ASK AYUSH INSTEAD</span>
      <a href="SearchLoading.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 18px; background: #312E81;">
        <span style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#82F5C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 14px; font-weight: 700; color: #FFFFFF;">"Which vitamin do I actually need?"</span>
          <span style="font-size: 12px; font-weight: 500; color: #C3C0FF;">Symptom-to-care routing, not a product list</span>
        </span>
      </a>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { tail: ' d3 60k', kind: 'Medicine • 3 brands in stock', tint: '#FFFBEB', ink: '#B45309', path: 'M8.5 15.5l7-7a4 4 0 0 0-5.7-5.7l-7 7a4 4 0 0 0 5.7 5.7z' },
      { tail: ' d test', kind: 'Lab test • NABL, dorm pickup', tint: '#ECFDF5', ink: '#047857', path: 'M9 3h6v5l3.5 8.2A3 3 0 0 1 15.7 21H8.3a3 3 0 0 1-2.8-4.8L9 8z' },
      { tail: ' b12 test', kind: 'Lab test • Blood panel', tint: '#ECFDF5', ink: '#047857', path: 'M12 3s6 6.4 6 10a6 6 0 0 1-12 0c0-3.6 6-10 6-10z' },
      { tail: ' profile', kind: 'Lab test • Comprehensive panel', tint: '#EEF2FF', ink: '#3525CD', path: 'M3 12h4l2 5 4-12 2 7h6' },
      { tail: ' deficiency', kind: 'Article • Verified by campus clinic', tint: '#F1F5F9', ink: '#475569', path: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z' },
      { tail: ' gummies', kind: 'Product • Student pharmacy', tint: '#FFF1F2', ink: '#E11D48', path: 'M12 20c4-2.5 6-5.6 6-9a6 6 0 0 0-12 0c0 3.4 2 6.5 6 9z' }
    ];
    return {
      suggestions: rows.map((r, i) => ({
        tail: r.tail,
        kind: r.kind,
        path: r.path,
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid #EAEDFF; animation: skRise .46s both cubic-bezier(.2,.7,.3,1); animation-delay: '
          + (0.06 + i * 0.05).toFixed(2) + 's;',
        iconStyle: 'width: 34px; height: 34px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: '
          + r.tint + '; color: ' + r.ink + ';'
      }))
    };
  }
}
</script>
</body>
</html>
