<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Searching</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
@keyframes skOrbit{to{transform:rotate(360deg)}}
@keyframes skFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skShimmer{from{background-position:-260px 0}to{background-position:340px 0}}
@keyframes skFade{from{opacity:0}to{opacity:1}}
@keyframes skTrack{0%{transform:translateX(-60%)}100%{transform:translateX(260%)}}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.35}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden;">
    <div style="align-self: center; display: flex; justify-content: center; margin-bottom: 4px;">
      <span style="width: 100px; height: 100px; border-radius: 26px; background: #EEF2FF; display: flex; align-items: center; justify-content: center;"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"></path></svg></span>
    </div>


  <div style="padding: 20px 20px 0; background: #FFFFFF;">
    <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 16px;">
      <a href="SearchTyping.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #F2F3FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
      </a>
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 15px; background: #FFFFFF; border: 2px solid #3525CD;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3525CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #131B2E;">vitamin</span>
      </div>
    </div>
    <div style="height: 3px; background: #EAEDFF; overflow: hidden;" aria-hidden="true">
      <div style="width: 38%; height: 3px; border-radius: 999px; background: #3525CD; animation: skTrack 1.25s cubic-bezier(.5,.05,.5,.95) infinite;"></div>
    </div>
  </div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; align-items: center; gap: 9px; animation: skFade .3s both;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #3525CD; animation: skPulse 1.1s ease-in-out infinite;" aria-hidden="true"></span>
      <span style="font-size: 13.5px; font-weight: 600; color: #464555;">Searching the student pharmacy, NABL labs and campus clinic…</span>
    </div>

    <div style="display: flex; gap: 10px;">
      <span style="width: 82px; height: 34px; border-radius: 999px; background: linear-gradient(90deg,#EAEDFF 0%,#F7F8FF 45%,#EAEDFF 90%); background-size: 320px 100%; animation: skShimmer 1.25s linear infinite;"></span>
      <span style="width: 70px; height: 34px; border-radius: 999px; background: linear-gradient(90deg,#EAEDFF 0%,#F7F8FF 45%,#EAEDFF 90%); background-size: 320px 100%; animation: skShimmer 1.25s linear .12s infinite;"></span>
      <span style="width: 96px; height: 34px; border-radius: 999px; background: linear-gradient(90deg,#EAEDFF 0%,#F7F8FF 45%,#EAEDFF 90%); background-size: 320px 100%; animation: skShimmer 1.25s linear .24s infinite;"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{ skeletons }}" as="sk" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 13px; padding: 15px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EAEDFF;">
          <span style="{{ sk.blockStyle }}"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 9px;">
            <span style="{{ sk.lineAStyle }}"></span>
            <span style="{{ sk.lineBStyle }}"></span>
          </span>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 28px; display: flex; align-items: center; justify-content: center; gap: 8px; animation: skFade .5s .4s both;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#777587" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7.5 3v5.6c0 4.3-3 8.2-7.5 9.4-4.5-1.2-7.5-5.1-7.5-9.4V6z"></path></svg>
    <span style="font-size: 12px; font-weight: 600; color: #6B6980;">Results are ranked by clinical fit, never by paid placement</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var shimmer = 'background: linear-gradient(90deg,#EAEDFF 0%,#F7F8FF 45%,#EAEDFF 90%); background-size: 320px 100%; animation: skShimmer 1.25s linear infinite;';
    var widths = ['72%', '58%', '66%', '50%', '62%'];
    return {
      skeletons: widths.map((w, i) => {
        var d = (i * 0.09).toFixed(2);
        return {
          blockStyle: 'width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; ' + shimmer + ' animation-delay: ' + d + 's;',
          lineAStyle: 'display: block; height: 12px; border-radius: 999px; width: ' + w + '; ' + shimmer + ' animation-delay: ' + d + 's;',
          lineBStyle: 'display: block; height: 10px; border-radius: 999px; width: 38%; ' + shimmer + ' animation-delay: ' + (parseFloat(d) + 0.05).toFixed(2) + 's;'
        };
      })
    };
  }
}
</script>
</body>
</html>
