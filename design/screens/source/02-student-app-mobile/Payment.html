<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 16px; background: #FFFFFF; border-bottom: 1px solid #EEF2FF; display: flex; align-items: center; gap: 12px;">
    <a href="Checkout.dc.html" aria-label="Back" style="width: 38px; height: 38px; border-radius: 999px; background: #F2F3FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </a>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 19px; font-weight: 800; color: #131B2E; letter-spacing: -0.4px;">Payment</span>
      <span style="font-size: 12px; font-weight: 500; color: #464555;">Step 2 of 2 · ₹578 to pay</span>
    </span>
    <span style="display: flex; gap: 5px;" aria-hidden="true">
      <span style="width: 22px; height: 5px; border-radius: 999px; background: #3525CD;"></span>
      <span style="width: 22px; height: 5px; border-radius: 999px; background: #3525CD;"></span>
    </span>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 800; color: #464555; letter-spacing: 1.1px; animation: skFade .4s both;">PAY WITH</span>
    <sc-for list="{{ methods }}" as="m" hint-placeholder-count="5">
      <button type="button" onClick="{{ m.pick }}" style="{{ m.rowStyle }}">
        <span style="{{ m.iconStyle }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ m.path }}"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; text-align: left;">
          <span style="font-size: 14.5px; font-weight: 700; color: #131B2E;">{{ m.label }}</span>
          <span style="font-size: 12px; font-weight: 500; color: #464555;">{{ m.meta }}</span>
        </span>
        <span style="{{ m.radioStyle }}"></span>
      </button>
    </sc-for>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px; animation: skRise .5s .3s both cubic-bezier(.2,.7,.3,1);">
    <span style="font-size: 12px; font-weight: 800; color: #464555; letter-spacing: 1.1px;">BILL SUMMARY</span>
    <div style="padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EEF2FF; display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 13.5px; font-weight: 500; color: #464555;">Item total</span>
        <span style="font-size: 13.5px; font-weight: 800; color: #131B2E;">₹848</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 13.5px; font-weight: 500; color: #464555;">Student discount</span>
        <span style="font-size: 13.5px; font-weight: 800; color: #047857;">− ₹270</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 13.5px; font-weight: 500; color: #464555;">Delivery to Block B</span>
        <span style="font-size: 13.5px; font-weight: 800; color: #047857;">FREE</span>
      </div>
      <div style="height: 1px; background: #EAEDFF;"></div>
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 800; color: #131B2E;">To pay</span>
        <span style="font-size: 19px; font-weight: 800; color: #131B2E; letter-spacing: -0.4px;">₹578</span>
      </div>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: flex; gap: 11px; animation: skFade .5s .4s both;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3525CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    <span style="font-size: 11.5px; line-height: 1.55; font-weight: 500; color: #464555;">Payment is processed by our gateway. Student Kare never stores your card details, and paying confers no access to anyone else's records.</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 14px 20px 18px; background: #FFFFFF; border-top: 1px solid #DAE2FD; animation: skFade .5s .45s both;">
    <a href="PaymentResult.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 999px; background: #3525CD; color: #FFFFFF; font-size: 16px; font-weight: 800;">{{ payLabel }}</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { method: 0 };
  }
  renderVals() {
    var self = this;
    var active = this.state.method;
    var rows = [
      { label: 'UPI', meta: 'GPay, PhonePe, Paytm or any UPI app', path: 'M4 12l8-8 8 8-8 8z' },
      { label: 'Debit or credit card', meta: 'Visa, Mastercard, RuPay', path: 'M3 6h18v12H3zM3 10h18' },
      { label: 'Net banking', meta: 'All major Indian banks', path: 'M3 21h18M5 21V10M19 21V10M12 3l9 5H3z' },
      { label: 'Kare points', meta: '1,240 points available · covers ₹124', path: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z' },
      { label: 'Cash on delivery', meta: 'Pay the runner at your block', path: 'M3 7h18v10H3zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z' }
    ];
    return {
      payLabel: active === 4 ? 'Place order · pay ₹578 on delivery' : 'Pay ₹578',
      methods: rows.map((r, i) => {
        var on = i === active;
        return {
          label: r.label,
          meta: r.meta,
          path: r.path,
          pick: () => self.setState({ method: i }),
          rowStyle: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 15px; border-radius: 16px; cursor: pointer; font-family: inherit; background: #FFFFFF; transition: border-color .2s ease; animation: skRise .46s both cubic-bezier(.2,.7,.3,1); animation-delay: '
            + (0.06 + i * 0.05).toFixed(2) + 's; border: ' + (on ? '2px solid #3525CD;' : '1px solid #DAE2FD;'),
          iconStyle: 'width: 38px; height: 38px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; '
            + (on ? 'background: #EEF2FF; color: #3525CD;' : 'background: #F2F3FF; color: #464555;'),
          radioStyle: 'width: 20px; height: 20px; border-radius: 999px; flex-shrink: 0; border: '
            + (on ? '6px solid #3525CD;' : '2px solid #C7C4D8;')
        };
      })
    };
  }
}
</script>
</body>
</html>
