<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order placed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes skFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}
@keyframes skPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes skHalo{0%{transform:scale(.85);opacity:.5}70%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
@keyframes skDraw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}
@keyframes skFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes skIcoPop{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 944px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; padding: 84px 24px 28px; overflow: hidden;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
    <div style="align-self: center; display: flex; justify-content: center;">
      <span style="position: relative; width: 210px; height: 210px; border-radius: 999px; overflow: hidden; display: block; animation: skIcoPop .6s both cubic-bezier(.2,.7,.3,1.3);"><img src="/_blob/cb61b75a951bda498b651db96b6bc729" alt="" style="width: 100%; height: 100%; object-fit: cover;"><span style="position: absolute; right: 14px; bottom: 14px; width: 54px; height: 54px; border-radius: 999px; background: #10B981; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; animation: skRise .5s .25s both cubic-bezier(.2,.7,.3,1);">
      <h1 style="margin: 0; text-align: center; font-size: 26px; line-height: 1.24; font-weight: 800; color: #131B2E; letter-spacing: -0.6px;">Order placed</h1>
      <p style="margin: 0; text-align: center; font-size: 15px; line-height: 1.6; font-weight: 500; color: #464555; max-width: 290px;">The campus pharmacy is packing it now. You'll get a WhatsApp ping when the runner leaves.</p>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; background: #EEF2FF; border: 1px solid #EEF2FF; animation: skFade .5s .35s both;">
      <span style="font-size: 12px; font-weight: 600; color: #464555;">Order</span>
      <span style="font-size: 13px; font-weight: 800; color: #3525CD; letter-spacing: 0.5px;">SK-48120</span>
    </div>
  </div>

  <div style="margin-top: 34px; display: flex; flex-direction: column; gap: 11px;">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
      <div style="{{ r.cardStyle }}">
        <span style="width: 38px; height: 38px; border-radius: 13px; background: #EEF2FF; color: #3525CD; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.path }}"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 13.5px; font-weight: 700; color: #131B2E;">{{ r.title }}</span>
          <span style="font-size: 12px; font-weight: 500; color: #464555;">{{ r.meta }}</span>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 12px; animation: skFade .5s .55s both;">
    <a href="OrderTracking.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 999px; background: #3525CD; color: #FFFFFF; font-size: 16px; font-weight: 800;">Track this order
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <a href="ShopHome.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EEF2FF; font-size: 14.5px; font-weight: 700; color: #131B2E;">Back to shop</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":944}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { title: 'Arriving tonight by 9:00 PM', meta: 'North Dorm, Block B · Room B-214', path: 'M3 7h11v8H3zM14 10h4l3 3v2h-7zM7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z' },
      { title: '₹578 paid via UPI', meta: 'You saved ₹320 on this order', path: 'M3 6h18v12H3zM3 10h18' },
      { title: '58 Kare points earned', meta: 'Points only — no cash value, not transferable', path: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z' }
    ];
    return {
      rows: rows.map((r, i) => ({
        title: r.title,
        meta: r.meta,
        path: r.path,
        cardStyle: 'display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EEF2FF; animation: skRise .48s both cubic-bezier(.2,.7,.3,1); animation-delay: '
          + (0.4 + i * 0.07).toFixed(2) + 's;'
      }))
    };
  }
}
</script>
</body>
</html>
