<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wellness products</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skRiseA{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes skRiseB{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}
@keyframes skSheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 20px 16px; background: #3525CD; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="ShopHome.dc.html" aria-label="Back" style="width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
      </a>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.3px;">Vitamins &amp; supplements</span>
        <span style="font-size: 12px; font-weight: 500; color: #C3C0FF;">{{ countLabel }}</span>
      </span>
      <a href="Cart.dc.html" aria-label="Cart" style="position: relative; width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7zM9 7V5a3 3 0 0 1 6 0v2"></path></svg>
        <span style="position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: #82F5C1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #00341F;">2</span>
      </a>
    </div>

    <div style="display: flex; gap: 8px;">
      <sc-for list="{{ sorts }}" as="s" hint-placeholder-count="4">
        <button type="button" onClick="{{ s.pick }}" style="{{ s.style }}">{{ s.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px;">
    <sc-for list="{{ items }}" as="p" hint-placeholder-count="6">
      <a href="ProductDetail.dc.html" style="{{ p.cardStyle }}">
        <span style="{{ p.thumbStyle }}">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ p.path }}"></path></svg>
          <span style="{{ p.badgeStyle }}">{{ p.off }}</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 5px; padding: 11px 12px 13px;">
          <span style="display: flex; align-items: center; gap: 5px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#047857" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
            <span style="font-size: 10.5px; font-weight: 700; color: #047857;">{{ p.rating }}</span>
            <span style="font-size: 10px; font-weight: 500; color: #6B6980;">({{ p.reviews }})</span>
          </span>
          <span style="font-size: 13px; line-height: 1.3; font-weight: 700; color: #131B2E;">{{ p.name }}</span>
          <span style="font-size: 10.5px; font-weight: 500; color: #6B6980;">{{ p.size }}</span>
          <span style="display: flex; align-items: center; justify-content: space-between; margin-top: 3px;">
            <span style="display: flex; flex-direction: column;">
              <span style="font-size: 14.5px; font-weight: 800; color: #131B2E;">{{ p.price }}</span>
              <span style="font-size: 10.5px; font-weight: 600; color: #6B6980; text-decoration: line-through;">{{ p.was }}</span>
            </span>
            <span style="width: 32px; height: 32px; border-radius: 999px; background: #3525CD; display: flex; align-items: center; justify-content: center;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </span>
          </span>
        </span>
      </a>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="Cart.dc.html" style="margin: 0 20px 18px; padding: 14px 18px; border-radius: 18px; background: #1E1B4B; display: flex; align-items: center; gap: 12px; animation: skFade .5s .4s both;">
    <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
      <span style="font-size: 13.5px; font-weight: 800; color: #FFFFFF;">2 items · ₹578</span>
      <span style="font-size: 11.5px; font-weight: 500; color: #C3C0FF;">₹0 delivery to North Dorm, Block B</span>
    </span>
    <span style="display: flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 800; color: #3525CD;">View cart
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3525CD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </span>
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sort: 0, tick: 0 };
  }
  renderVals() {
    var self = this;
    var active = this.state.sort;
    var anim = this.state.tick % 2 === 0 ? 'skRiseA' : 'skRiseB';
    var labels = ['Popular', 'Price', 'Rating', 'Discount'];

    var base = [
      { name: 'Daily Multivitamin Essentials', size: 'Bottle of 30 tablets', price: 299, was: '₹449', off: '33% off', rating: '4.6', reviews: '312', g: '#3525CD', path: 'M8.5 15.5l7-7a4 4 0 0 0-5.7-5.7l-7 7a4 4 0 0 0 5.7 5.7z' },
      { name: 'Vitamin D3 60K Sachets', size: 'Pack of 4 sachets', price: 149, was: '₹249', off: '40% off', rating: '4.8', reviews: '198', g: '#4F46E5', path: 'M12 3v3M12 18v3M3 12h3M18 12h3M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z' },
      { name: 'Ashwagandha Stress Balance', size: 'Bottle of 60 capsules', price: 299, was: '₹449', off: '33% off', rating: '4.9', reviews: '270', g: '#4338CA', path: 'M19 5c0 8-5 13-13 13 0-8 5-13 13-13z' },
      { name: 'Vitamin C Effervescent', size: 'Tube of 20 tablets', price: 189, was: '₹259', off: '27% off', rating: '4.4', reviews: '141', g: '#3730A3', path: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 4v16M4 12h16' },
      { name: 'Omega 3 Fish Oil', size: 'Bottle of 60 softgels', price: 549, was: '₹899', off: '39% off', rating: '4.7', reviews: '204', g: '#4F46E5', path: 'M3 12c4-5 10-5 14 0-4 5-10 5-14 0zM17 12l4-3v6z' },
      { name: 'Magnesium Sleep Support', size: 'Bottle of 45 tablets', price: 419, was: '₹599', off: '30% off', rating: '4.5', reviews: '96', g: '#312E81', path: 'M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z' }
    ];

    var list = base.slice();
    if (active === 1) list.sort((a, b) => a.price - b.price);
    if (active === 2) list.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
    if (active === 3) list.sort((a, b) => parseInt(b.off) - parseInt(a.off));

    return {
      countLabel: base.length + ' items · sorted by ' + labels[active].toLowerCase(),
      sorts: labels.map((label, i) => ({
        label: label,
        pick: () => self.setState({ sort: i, tick: self.state.tick + 1 }),
        style: 'height: 34px; padding: 0 15px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit; font-size: 12.5px; transition: background .2s ease, color .2s ease; '
          + (i === active ? 'background: #FFFFFF; color: #3525CD; font-weight: 800;' : 'background: rgba(255,255,255,0.16); color: #FFFFFF; font-weight: 600;')
      })),
      items: list.map((p, i) => ({
        name: p.name,
        size: p.size,
        price: '₹' + p.price,
        was: p.was,
        off: p.off,
        rating: p.rating,
        reviews: p.reviews,
        path: p.path,
        cardStyle: 'border-radius: 18px; background: #FFFFFF; border: 1px solid #EEF2FF; overflow: hidden; display: flex; flex-direction: column; animation: '
          + anim + ' .46s both cubic-bezier(.2,.7,.3,1); animation-delay: ' + (i * 0.055).toFixed(2) + 's;',
        thumbStyle: 'position: relative; height: 104px; display: flex; align-items: center; justify-content: center; background: ' + p.g + ';',
        badgeStyle: 'position: absolute; top: 9px; left: 9px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.32); font-size: 9.5px; font-weight: 800; color: #FFFFFF; letter-spacing: 0.3px;'
      }))
    };
  }
}
</script>
</body>
</html>
