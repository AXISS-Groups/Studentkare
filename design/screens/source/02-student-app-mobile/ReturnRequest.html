<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Return or refund</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
input,select{font-family:inherit}
@keyframes skRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes skPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.4}}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; padding: 24px 20px 28px; position: relative; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 12px;"><a href="OrderHistory.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EEF2FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a><span style="flex-grow: 1; font-size: 17px; font-weight: 800; color: #131B2E;">Return or refund</span></div>
  <div style="margin-top: 16px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EEF2FF; display: flex; justify-content: space-between;"><span style="display: flex; flex-direction: column; gap: 2px;"><span class="mono" style="font-size: 13px; font-weight: 600; color: #131B2E;">ORD-5514</span><span style="font-size: 12px; color: #6B6980;">Delivered 21 Sep · Block B gate</span></span><span class="mono" style="font-size: 15px; font-weight: 600; color: #131B2E;">₹648</span></div>
  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #464555;">WHICH ITEMS</span>
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="3"><button type="button" onClick="{{ i.toggle }}" aria-pressed="{{ i.on }}" style="{{ i.style }}"><span style="{{ i.box }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: left;"><span style="font-size: 14px; font-weight: 700; color: #131B2E;">{{ i.name }}</span><span style="{{ i.metaStyle }}">{{ i.meta }}</span></span><span class="mono" style="font-size: 13px; color: #464555;">{{ i.price }}</span></button></sc-for>
  </div>
  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #464555;">WHAT’S WRONG</span><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ whys }}" as="w" hint-placeholder-count="5"><button type="button" onClick="{{ w.pick }}" style="{{ w.style }}">{{ w.label }}</button></sc-for></div></div>
  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #464555;">PHOTO (HELPS US DECIDE FASTER)</span><button type="button" onClick="{{ photo }}" style="{{ photoStyle }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg><span>{{ photoLabel }}</span></button></div>
  <div style="margin-top: 16px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EEF2FF; display: flex; flex-direction: column; gap: 6px;"><span style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; color: #131B2E;">Refund<span class="mono">{{ refund }}</span></span><span style="font-size: 12px; color: #6B6980;">To your original payment method · 3–5 working days after pickup</span></div>
  <span style="flex-grow: 1;"></span>
  <button type="button" onClick="{{ submit }}" style="{{ subStyle }}">{{ subLabel }}</button>
  <sc-if value="{{ doneLink }}" hint-placeholder-val="{{ false }}"><a href="ResultRefund.dc.html" style="margin-top: 10px; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; border: 1.5px solid #3525CD; font-size: 15px; font-weight: 800; color: #3525CD;">See refund status</a></sc-if>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 100px; z-index: 30; padding: 12px 16px; border-radius: 14px; background: #131B2E; font-size: 13.5px; font-weight: 700; color: #FFFFFF; animation: skPop .25s both;">{{ toast }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: {}, why: null, photo: false, done: false, toast: false }; }
  componentWillUnmount() { clearTimeout(this._t); clearInterval(this._iv); }
  renderVals() {
    var self = this;
    var TONE = {
      indigo: 'background: #EEF2FF; color: #3525CD;', green: 'background: #ECFDF5; color: #047857;',
      amber: 'background: #FFFBEB; color: #B45309;', red: 'background: #FFF1F2; color: #BE123C;', grey: 'background: #F2F3F9; color: #464555;'
    };
    function chip(t) { return 'display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; ' + TONE[t]; }
    var common = { toast: this.state.toast || false };
    function flash(msg) { self.setState({ toast: msg }); clearTimeout(self._t); self._t = setTimeout(function () { self.setState({ toast: false }); }, 2600); }


    var s = this.state, sel = s.sel || {};
    var IT = [['sun','SPF 50 sunscreen, 50 ml','Sealed · returnable within 7 days',349,true],['mv','Daily Multivitamin Essentials','Opened pack · returnable only if damaged',299,true],['cet','Cetirizine 10 mg (Rx)','Prescription medicine · not returnable unless wrong or damaged',0,false]];
    var amt = IT.filter(function (i) { return sel[i[0]]; }).reduce(function (a, i) { return a + i[3]; }, 0);
    var ok = amt > 0 && !!s.why;
    return Object.assign(common, {
      items: IT.map(function (i) { var on = !!sel[i[0]]; return { name: i[1], meta: i[2], price: i[3] ? '₹' + i[3] : '—', on: on ? 'true' : 'false',
        metaStyle: 'font-size: 11.5px; line-height: 1.4; color: ' + (i[4] ? '#777587;' : '#B45309;'),
        toggle: function () { var n = Object.assign({}, sel); n[i[0]] = !n[i[0]]; self.setState({ sel: n }); },
        box: 'width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #3525CD;' : 'background: #FFFFFF; border: 1.5px solid #C7C4D8;'),
        style: 'display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; font-family: inherit; cursor: pointer; ' + (on ? 'background: #EEF2FF; border: 1.5px solid #4F46E5;' : 'background: #FFFFFF; border: 1px solid #EEF2FF;') }; }),
      whys: ['Damaged','Wrong item','Expired','Not what I ordered','Changed my mind'].map(function (w) { var on = s.why === w; return { label: w, pick: function () { self.setState({ why: w }); },
        style: 'height: 36px; padding: 0 13px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #3525CD; color: #FFFFFF; border: 0;' : 'background: #FFFFFF; color: #464555; border: 1px solid #DAE2FD;') }; }),
      photo: function () { self.setState({ photo: true }); }, photoLabel: s.photo ? 'photo_2109.jpg · added' : 'Add a photo',
      photoStyle: 'display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 16px; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; ' + (s.photo ? 'background: #ECFDF5; border: 1.5px solid #6EE7B7; color: #047857;' : 'background: #F7F6FF; border: 2px dashed #A5B4FC; color: #3525CD;'),
      refund: '₹' + amt,
      doneLink: !!s.done,
      subLabel: s.done ? 'Request sent · pickup tomorrow' : ok ? 'Request refund of ₹' + amt : 'Pick items and a reason',
      subStyle: 'height: 56px; border-radius: 16px; border: 0; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; ' + (s.done ? 'background: #047857; color: #FFFFFF;' : ok ? 'background: #3525CD; color: #FFFFFF;' : 'background: #DAE2FD; color: #6B6980;'),
      submit: function () { if (!ok || s.done) return; self.setState({ done: true }); flash('Pickup booked for tomorrow · refund after inspection'); }
    });
  }
}
</script>
</body>
</html>
