<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}
@keyframes skRiseA{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes skRiseB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes skFade{from{opacity:0}to{opacity:1}}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; overflow: hidden;">

  <div style="background: #FFFFFF; border-bottom: 1px solid #EEF2FF;">
    <div style="padding: 20px 20px 14px; display: flex; align-items: center; gap: 12px;">
      <a href="SearchTyping.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #F2F3FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
      </a>
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 15px; background: #F2F3FF; border: 1px solid #EEF2FF;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3525CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #131B2E;">vitamin</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#777587" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
    </div>

    <div style="padding: 0 20px; display: flex; gap: 4px; position: relative;">
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
        <button type="button" onClick="{{ tab.pick }}" style="{{ tab.style }}">{{ tab.label }}</button>
      </sc-for>
    </div>
    <div style="height: 3px; background: #EAEDFF; position: relative;" aria-hidden="true">
      <div style="{{ underlineStyle }}"></div>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 18px; font-weight: 800; color: #131B2E; letter-spacing: -0.3px;">{{ heading }}</span>
      <span style="font-size: 12.5px; font-weight: 500; color: #464555;">{{ subhead }}</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <span style="display: flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EEF2FF; font-size: 12.5px; font-weight: 700; color: #131B2E;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#464555" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
        Filters
      </span>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 11px;">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
      <a href="{{ item.href }}" style="{{ item.cardStyle }}">
        <span style="{{ item.iconStyle }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.path }}"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 14.5px; font-weight: 700; color: #131B2E;">{{ item.title }}</span>
          <span style="font-size: 12.5px; font-weight: 500; color: #464555;">{{ item.meta }}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
          <span style="font-size: 14px; font-weight: 800; color: #131B2E;">{{ item.price }}</span>
          <span style="{{ item.tagStyle }}">{{ item.tag }}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="NoResults.dc.html" style="margin: 0 20px 24px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EEF2FF; font-size: 14px; font-weight: 700; color: #3525CD; animation: skFade .5s .35s both;">
    Show everything for "vitamin"
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 0, tick: 0 };
  }
  renderVals() {
    var self = this;
    var active = this.state.tab;
    var anim = this.state.tick % 2 === 0 ? 'skRiseA' : 'skRiseB';
    var labels = ['All', 'Medicines', 'Lab tests', 'Doctors'];

    var sets = [
      [
        { title: 'Vitamin D3 60K', meta: 'Medicine • 4 sachets • Student pharmacy', price: '₹149', tag: 'In stock', tone: 'green', href: 'LabResults.dc.html', tint: '#FFFBEB', ink: '#B45309', path: 'M8.5 15.5l7-7a4 4 0 0 0-5.7-5.7l-7 7a4 4 0 0 0 5.7 5.7z' },
        { title: 'Vitamin D Test', meta: 'Lab test • NABL • Dorm pickup', price: '₹499', tag: '42% off', tone: 'indigo', href: 'LabResults.dc.html', tint: '#ECFDF5', ink: '#047857', path: 'M9 3h6v5l3.5 8.2A3 3 0 0 1 15.7 21H8.3a3 3 0 0 1-2.8-4.8L9 8z' },
        { title: 'Dr. Ananya Reddy', meta: 'MD Internal Medicine • Ready in 15 mins', price: 'Free', tag: 'Edu ID', tone: 'indigo', href: 'DoctorResults.dc.html', tint: '#EEF2FF', ink: '#3525CD', path: 'M6 4v6a6 6 0 0 0 12 0V4' },
        { title: 'Why students run low on D3', meta: 'Article • Verified by campus clinic', price: '3 min', tag: 'Read', tone: 'grey', href: 'LabResults.dc.html', tint: '#F1F5F9', ink: '#475569', path: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z' }
      ],
      [
        { title: 'Vitamin D3 60K', meta: '4 sachets • Sun pharma', price: '₹149', tag: 'In stock', tone: 'green', href: 'LabResults.dc.html', tint: '#FFFBEB', ink: '#B45309', path: 'M8.5 15.5l7-7a4 4 0 0 0-5.7-5.7l-7 7a4 4 0 0 0 5.7 5.7z' },
        { title: 'Daily Multivitamin', meta: '30 tablets • Zinc + B-complex', price: '₹299', tag: '33% off', tone: 'indigo', href: 'LabResults.dc.html', tint: '#FFFBEB', ink: '#B45309', path: 'M8.5 15.5l7-7a4 4 0 0 0-5.7-5.7l-7 7a4 4 0 0 0 5.7 5.7z' },
        { title: 'Vitamin C Effervescent', meta: '20 tablets • Immunity', price: '₹189', tag: 'In stock', tone: 'green', href: 'LabResults.dc.html', tint: '#FFF1F2', ink: '#E11D48', path: 'M12 20c4-2.5 6-5.6 6-9a6 6 0 0 0-12 0c0 3.4 2 6.5 6 9z' }
      ],
      [
        { title: 'Vitamin D Test', meta: 'NABL • Report in 24 hrs', price: '₹499', tag: '42% off', tone: 'indigo', href: 'LabResults.dc.html', tint: '#ECFDF5', ink: '#047857', path: 'M9 3h6v5l3.5 8.2A3 3 0 0 1 15.7 21H8.3a3 3 0 0 1-2.8-4.8L9 8z' },
        { title: 'Vitamin B12 Test', meta: 'Blood test • Fasting not needed', price: '₹429', tag: 'Popular', tone: 'green', href: 'LabResults.dc.html', tint: '#ECFDF5', ink: '#047857', path: 'M12 3s6 6.4 6 10a6 6 0 0 1-12 0c0-3.6 6-10 6-10z' },
        { title: 'Vitamin Profile', meta: '9 parameters • Comprehensive panel', price: '₹1,299', tag: 'Bundle', tone: 'indigo', href: 'LabResults.dc.html', tint: '#EEF2FF', ink: '#3525CD', path: 'M3 12h4l2 5 4-12 2 7h6' }
      ],
      [
        { title: 'Dr. Ananya Reddy', meta: 'MD Internal Medicine • 4.96 • 15 mins', price: 'Free', tag: 'Edu ID', tone: 'indigo', href: 'DoctorResults.dc.html', tint: '#EEF2FF', ink: '#3525CD', path: 'M6 4v6a6 6 0 0 0 12 0V4' },
        { title: 'Dr. Vikram Iyer', meta: 'Clinical Nutritionist • 4.88 • Today 6pm', price: '₹299', tag: 'Campus', tone: 'green', href: 'DoctorResults.dc.html', tint: '#ECFDF5', ink: '#047857', path: 'M12 8a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 8V4' },
        { title: 'Dr. Meera Nair', meta: 'Endocrinology • 4.91 • Tomorrow', price: '₹549', tag: 'Video', tone: 'grey', href: 'DoctorResults.dc.html', tint: '#F1F5F9', ink: '#475569', path: 'M12 3l7.5 3v5.6c0 4.3-3 8.2-7.5 9.4-4.5-1.2-7.5-5.1-7.5-9.4V6z' }
      ]
    ];

    var tones = {
      green: 'background: #ECFDF5; color: #047857;',
      indigo: 'background: #EEF2FF; color: #3525CD;',
      grey: 'background: #F1F5F9; color: #475569;'
    };

    var heads = [
      { h: 'Everything for "vitamin"', s: '14 results across the campus catalogue' },
      { h: 'Medicines', s: '6 verified pharmacy items' },
      { h: 'Lab tests', s: '5 NABL tests with dorm sample pickup' },
      { h: 'Doctors', s: '3 clinicians available this week' }
    ];

    return {
      heading: heads[active].h,
      subhead: heads[active].s,
      underlineStyle: 'position: absolute; top: 0; height: 3px; border-radius: 999px; background: #3525CD; transition: left .28s cubic-bezier(.2,.7,.3,1), width .28s cubic-bezier(.2,.7,.3,1); left: '
        + (20 + active * 86) + 'px; width: 80px;',
      tabs: labels.map((label, i) => ({
        label: label,
        pick: () => self.setState({ tab: i, tick: self.state.tick + 1 }),
        style: 'width: 82px; height: 42px; border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 13.5px; transition: color .2s ease; '
          + (i === active ? 'font-weight: 800; color: #3525CD;' : 'font-weight: 600; color: #6B6980;')
      })),
      items: sets[active].map((it, i) => ({
        title: it.title,
        meta: it.meta,
        price: it.price,
        tag: it.tag,
        path: it.path,
        href: it.href,
        cardStyle: 'display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EEF2FF; animation: '
          + anim + ' .44s both cubic-bezier(.2,.7,.3,1); animation-delay: ' + (i * 0.06).toFixed(2) + 's;',
        iconStyle: 'width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: '
          + it.tint + '; color: ' + it.ink + ';',
        tagStyle: 'padding: 4px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.4px; ' + tones[it.tone]
      }))
    };
  }
}
</script>
</body>
</html>
