<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF;color:#131B2E}
a{color:#0C0494;text-decoration:none}a:hover{color:#2B20C9}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:3px solid #6D5BFF;outline-offset:3px;border-radius:14px}
@keyframes skRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes skRide{0%{left:6%}100%{left:66%}}
@keyframes skDash{to{stroke-dashoffset:-24}}
@keyframes skLive{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}100%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}
.sk-card{transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s}.sk-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(12,4,148,.12)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #FAF8FF; position: relative; overflow: hidden;">

  <header style="padding: 18px 20px 0; display: flex; align-items: center; gap: 12px; animation: skRise .5s both;">
    <div style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 600; color: #6B6980;">Medicines, tests and visits</span><h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.7px;">Your orders</h1></div>
    <a href="Profile.dc.html" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; box-shadow: 0 4px 14px rgba(12,4,148,.08);">Help</a>
  </header>

  <div role="tablist" aria-label="Orders" style="margin: 16px 20px 0; padding: 4px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(12,4,148,.06); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); animation: skRise .5s .05s both;">
    <button type="button" role="tab" aria-selected="{{ activeSel }}" onClick="{{ pickActive }}" style="{{ activeStyle }}">Active · 1</button>
    <button type="button" role="tab" aria-selected="{{ pastSel }}" onClick="{{ pickPast }}" style="{{ pastStyle }}">Past</button>
  </div>

  <sc-if value="{{ isActive }}" hint-placeholder-val="{{ true }}">
    <section style="margin: 16px 20px 0; border-radius: 28px; overflow: hidden; background: #FFFFFF; box-shadow: 0 10px 28px rgba(12,4,148,.10); animation: skRise .45s both;">
      <div style="position: relative; height: 150px; background: linear-gradient(160deg, #EEF2FF, #E0E7FF 60%, #C7D2FE); overflow: hidden;">
        <svg width="390" height="150" viewBox="0 0 390 150" aria-hidden="true" style="position: absolute; inset: 0;"><path d="M24 110 C 110 30, 190 140, 270 60 S 340 40, 360 50" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path><path d="M24 110 C 110 30, 190 140, 270 60 S 340 40, 360 50" fill="none" stroke="#0C0494" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" style="animation: skDash 1s linear infinite;"></path></svg>
        <span aria-hidden="true" style="position: absolute; left: 16px; bottom: 26px; width: 30px; height: 30px; border-radius: 10px; background: #0C0494; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M12 11v6M9 14h6"></path></svg></span>
        <span aria-hidden="true" style="position: absolute; right: 16px; top: 28px; width: 34px; height: 34px; border-radius: 999px; background: #10B981; display: flex; align-items: center; justify-content: center; animation: skLive 1.6s infinite;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v9h14v-9M10 19v-5h4v5"></path></svg></span>
        <span aria-hidden="true" style="position: absolute; top: 58px; width: 40px; height: 40px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 8px 18px rgba(12,4,148,.22); display: flex; align-items: center; justify-content: center; animation: skRide 6s ease-in-out infinite alternate;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0C0494" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><path d="M6 17h4l3-7h4l1 7M13 10l-2-4H8"></path></svg></span>
      </div>
      <div style="padding: 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #6B6980;">ORDER SK-[ID]</span><span style="padding: 4px 10px; border-radius: 999px; background: #ECFDF5; color: #047857; font-size: 11px; font-weight: 800;">On the way</span></div>
        <h2 style="margin: 8px 0 2px; font-size: 20px; font-weight: 800; letter-spacing: -0.4px;">Arriving at Block C by 12 pm</h2>
        <p style="margin: 0; font-size: 12.5px; font-weight: 600; color: #464555;">2 items · paid ₹[amount]</p>
        <div style="margin-top: 14px; padding: 12px 14px; border-radius: 18px; background: #F2F3FF; display: flex; align-items: center; justify-content: space-between;">
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 11px; font-weight: 700; color: #6B6980;">Handover code</span><span style="font-size: 22px; font-weight: 700; letter-spacing: 6px; font-family: 'JetBrains Mono', monospace; color: #0C0494;">4 8 1 7</span></span>
          <span style="font-size: 11.5px; font-weight: 600; color: #464555; max-width: 120px; text-align: right;">Say it only when the parcel is in your hand</span>
        </div>
        <ol style="margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
            <li style="display: flex; gap: 12px;">
              <span style="display: flex; flex-direction: column; align-items: center;"><span style="{{ s.dot }}"></span><sc-if value="{{ s.line }}" hint-placeholder-val="{{ true }}"><span style="{{ s.lineStyle }}"></span></sc-if></span>
              <span style="padding-bottom: 14px; display: flex; flex-direction: column; gap: 2px;"><span style="{{ s.titleStyle }}">{{ s.k }}</span><span style="font-size: 11.5px; font-weight: 600; color: #6B6980;">{{ s.v }}</span></span>
            </li>
          </sc-for>
        </ol>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{ isPast }}" hint-placeholder-val="{{ false }}">
    <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{ past }}" as="p" hint-placeholder-count="3">
        <div class="sk-card" style="border-radius: 24px; padding: 16px; background: #FFFFFF; box-shadow: 0 6px 18px rgba(12,4,148,.06); display: flex; flex-direction: column; gap: 10px; animation: skRise .35s both;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 800;">{{ p.title }}</span><span style="font-size: 11.5px; font-weight: 600; color: #6B6980;">{{ p.meta }}</span></span><span style="padding: 4px 10px; border-radius: 999px; background: #F1F5F9; color: #475569; font-size: 10.5px; font-weight: 800;">{{ p.state }}</span></div>
          <div style="display: flex; gap: 8px;"><a href="Product.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #0C0494; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center;">Buy again</a><a href="Profile.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #DAE2FD; color: #464555; font-size: 12.5px; font-weight: 800; display: flex; align-items: center;">{{ p.second }}</a></div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 70px; border-radius: 999px; background: linear-gradient(160deg, #1A10B5, #0C0494); box-shadow: 0 18px 40px rgba(12,4,148,.35); display: flex; align-items: center; justify-content: space-between; padding: 0 10px;">
    <a href="Main.dc.html" aria-label="Home" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C7C3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="Orders.dc.html" aria-current="page" style="height: 52px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; color: #0C0494; font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 7px;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0C0494" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5zM3 8v8l9 5 9-5V8M12 13v8"></path></svg>Orders</a>
    <a href="AskAyush.dc.html" aria-label="Ask Ayush" style="width: 52px; height: 52px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #A5F3FC, #6D5BFF 55%, #2B20C9); display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"></path></svg></a>
    <a href="Insights.dc.html" aria-label="My health" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C7C3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"></path></svg></a>
    <a href="Profile.dc.html" aria-label="Profile" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C7C3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'active' }; }
  renderVals() {
    const t = this.state.tab;
    const seg = (on) => 'height: 42px; border: 0; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 800; transition: all .25s; ' + (on ? 'background: #0C0494; color: #FFFFFF; box-shadow: 0 8px 18px rgba(12,4,148,.25);' : 'background: transparent; color: #464555;');
    const st = [
      ['Order placed', '10:02 am', 'done'],
      ['Pharmacist checked your prescription', '10:20 am', 'done'],
      ['Packed by [Partner pharmacy]', '10:41 am', 'done'],
      ['On the way to Block C', 'Now', 'now']
    ];
    return {
      isActive: t === 'active', isPast: t === 'past',
      activeSel: t === 'active' ? 'true' : 'false', pastSel: t === 'past' ? 'true' : 'false',
      pickActive: () => this.setState({ tab: 'active' }), pickPast: () => this.setState({ tab: 'past' }),
      activeStyle: seg(t === 'active'), pastStyle: seg(t === 'past'),
      steps: st.map(([k, v, s], i) => ({
        k, v, line: i < st.length - 1,
        dot: 'width: 14px; height: 14px; margin-top: 2px; border-radius: 999px; ' + (s === 'now' ? 'background: #10B981; animation: skLive 1.6s infinite;' : 'background: #0C0494;'),
        lineStyle: 'width: 2px; flex-grow: 1; min-height: 20px; background: #0C0494;',
        titleStyle: 'font-size: 13.5px; font-weight: ' + (s === 'now' ? '800; color: #047857;' : '700; color: #131B2E;')
      })),
      past: [
        { title: 'Cetirizine and ORS', meta: 'Delivered 2 Oct · ₹[amount]', state: 'Delivered', second: 'Return' },
        { title: 'Complete blood count', meta: 'Report ready 15 Jun', state: 'Done', second: 'See report' },
        { title: 'Vitamin D3 60K', meta: 'Picked up 8 Sep · ₹[amount]', state: 'Picked up', second: 'Return' }
      ]
    };
  }
}
</script>
</body>
</html>
