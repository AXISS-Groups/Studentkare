<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your permissions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ---- motion & interaction system: applied to every artboard ---- */
/* focus: visible on keyboard, never on mouse click */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4F46E5;outline-offset:3px;border-radius:10px}
a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
/* links and controls acknowledge the press before the route changes */
a,button{transition:opacity .18s ease,transform .18s cubic-bezier(.2,.7,.3,1)}
a:active,button:active{transform:translateY(1px)}
/* loader vocabulary */
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBar{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes skShimmer{0%{background-position:-420px 0}100%{background-position:420px 0}}
@keyframes skDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
/* respect the system setting: end states, no movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;
    scroll-behavior:auto !important}
  a:active,button:active{transform:none}
}

body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAF8FF}
a{color:#3525CD;text-decoration:none}a:hover{color:#4F46E5}

/* sk-icon-motion v1: every 24px line icon draws in once and pops on hover/focus */
@keyframes skiIconDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes skiIconPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
svg[viewBox="0 0 24 24"][stroke]>*{stroke-dasharray:200;animation:skiIconDraw 1s cubic-bezier(.2,.7,.3,1) both}
a:hover svg[viewBox="0 0 24 24"],button:hover svg[viewBox="0 0 24 24"],a:focus-visible svg[viewBox="0 0 24 24"],button:focus-visible svg[viewBox="0 0 24 24"]{animation:skiIconPop .5s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){svg[viewBox="0 0 24 24"]>*{animation:none!important;stroke-dasharray:none!important}svg[viewBox="0 0 24 24"]{animation:none!important}}

/* sk-a11y v1: 44px touch targets without moving the layout */
:where(a,button,[role="switch"]):not([style*="position: absolute"]):not([style*="position:absolute"]){position:relative}
:where(a,button,[role="switch"])::after{content:"";position:absolute;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8FF; display: flex; flex-direction: column; padding: 28px 24px 34px;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="VerifyIdentity.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EEF2FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#131B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; gap: 6px;" aria-hidden="true">
      <span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #3525CD;"></span><span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #3525CD;"></span><span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #3525CD;"></span><span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #3525CD;"></span><span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #3525CD;"></span><span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #3525CD;"></span>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: #464555;">6 of 6</span>
  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; color: #131B2E; letter-spacing: -0.5px;">You decide what's on</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; font-weight: 500; color: #464555;">Every one of these is off by default except safety. Change any of them later in Settings.</p>
  </div>

  <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{ perms }}" as="perm" hint-placeholder-count="4">
      <div style="display: flex; align-items: flex-start; gap: 13px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EEF2FF;">
        <span style="{{ perm.iconStyle }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ perm.path }}"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 14.5px; font-weight: 700; color: #131B2E;">{{ perm.title }}</span>
          <span style="font-size: 12.5px; line-height: 1.5; font-weight: 500; color: #464555;">{{ perm.body }}</span>
        </span>
        <button type="button" onClick="{{ perm.toggle }}" aria-label="{{ perm.title }}" style="{{ perm.trackStyle }}">
          <span style="{{ perm.knobStyle }}"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="AccountReady.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #3525CD; color: #FFFFFF; font-size: 16px; font-weight: 700;">Finish setup</a>

  <div style="margin-top: 16px; text-align: center;">
    <a href="AccountReady.dc.html" style="font-size: 14px; font-weight: 600; color: #464555;">Not now</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { sos: true, reminders: true, pickup: false, ayush: false } };
  }
  renderVals() {
    var st = this.state.on;
    var rows = [
      { id: 'sos', title: 'Crisis alerts and SOS', body: 'Lets the 24×7 crisis bar reach your counsellor and emergency contact.', path: 'M12 3l7.5 3v5.6c0 4.3-3 8.2-7.5 9.4-4.5-1.2-7.5-5.1-7.5-9.4V6z' },
      { id: 'reminders', title: 'Consult and dose reminders', body: 'Notifications before appointments and at medication times.', path: 'M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7' },
      { id: 'pickup', title: 'Dorm pickup location', body: 'Shares your block with the phlebotomist on the day of a sample pickup only.', path: 'M12 21s7-5.2 7-10.5A7 7 0 0 0 5 10.5C5 15.8 12 21 12 21z' },
      { id: 'ayush', title: 'Ayush AI history', body: 'Keeps past symptom chats so Ayush can follow up. Delete any time.', path: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z' }
    ];
    return {
      perms: rows.map((r) => {
        var on = !!st[r.id];
        return {
          title: r.title,
          body: r.body,
          path: r.path,
          toggle: () => {
            var next = Object.assign({}, this.state.on);
            next[r.id] = !next[r.id];
            this.setState({ on: next });
          },
          iconStyle: 'width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; '
            + (on ? 'background: #EEF2FF; color: #3525CD;' : 'background: #F1F5F9; color: #475569;'),
          trackStyle: 'width: 48px; height: 28px; border-radius: 999px; border: 0; padding: 3px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; '
            + (on ? 'background: #3525CD; justify-content: flex-end;' : 'background: #C7C4D8; justify-content: flex-start;'),
          knobStyle: 'width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; display: block;'
        };
      })
    };
  }
}
</script>
</body>
</html>
