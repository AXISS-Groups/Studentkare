<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Kare icons</title>
<style>
:root{--bg:#FAF8FF;--card:#fff;--ink:#131B2E;--mute:#5B5A6E;--line:#E4E7F5;--on:#3525CD}
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--bg);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center;z-index:2}
h1{font-size:18px;margin:0 12px 0 0}input,select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;max-width:100%}
h2{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:24px 20px 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:0 20px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
figure svg{width:32px;height:32px}figure.big svg{width:56px;height:56px}
figcaption{font:11px ui-monospace,monospace;text-align:center;word-break:break-all;display:flex;flex-direction:column}figcaption small{color:var(--mute)}
figure.hit{border:2px solid var(--on)}figure.hide{display:none}#count{color:var(--mute)}
</style></head><body>
